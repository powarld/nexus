let chain=Promise.resolve();
const q=fn=>{chain=chain.then(fn).catch(e=>{console.error(e);toast('Não foi possível salvar. Tente de novo.')});return chain};
const put=(c,id,data)=>{if(c==='sessions')try{rkSoon()}catch(e){}if(c==='subjects'&&data&&typeof data.name==='string')data=Object.assign({},data,{name:fmtName(data.name)});if(c==='subjects'&&data&&CURSOS&&cursoAct()&&!get('subjects',id)&&!(data.concursoIds||[]).length)data=Object.assign({},data,{concursoIds:[cursoAct()]});if(c==='cards'&&data&&!get('cards',id)){data=Object.assign({},data);if(!data.due)data.due=addDays(today(),1);if(!data.mapId){try{data.mapId=mapGuess(data)||''}catch(e){data.mapId=''}}}if(data&&data._tpl){data=Object.assign({},data);delete data._tpl}return db?q(()=>db.collection(c).doc(id).set(data)):toast('Sem conexão com os dados')};
const patch=(c,id,data)=>{if(!db)return toast('Sem conexão com os dados');
  if(c==='subjects'&&data&&typeof data.name==='string')data=Object.assign({},data,{name:fmtName(data.name)});
  const d=S[c]&&S[c].find(x=>x.id===id);if(d&&!Object.keys(data).some(k=>k.includes('.')||(data[k]&&data[k].__delete__))){Object.assign(d,data);try{scheduleRender()}catch(e){}} // atualização imediata na tela
  if(d&&d._tpl)return q(()=>db.collection(c).doc(id).set(strip(d)));
  return q(()=>db.collection(c).doc(id).update(data))};
const del=(c,id)=>{if(!db)return toast('Sem conexão com os dados');
  const i=S[c]?S[c].findIndex(x=>x.id===id):-1;if(i>=0){S[c].splice(i,1);try{scheduleRender()}catch(e){}} // some da tela na hora
  if(CURSOS&&!ADMIN&&(TPL[c]||[]).some(x=>x.id===id))return q(()=>db.collection(c).doc(id).set({_del:1,deletedAt:Date.now()}));
  return q(()=>db.collection(c).doc(id).delete())};

const fmtName=s=>{s=String(s==null?'':s).replace(/\s+/g,' ').trim();if(!s)return s;const LOW=new Set(['de','da','do','das','dos','e','em','a','o','as','os','na','no','nas','nos','para','por','com','ao','aos','à','às','um','uma','ou','sobre','pelo','pela']);const up=s===s.toUpperCase()&&s!==s.toLowerCase();let first=true;return s.split(' ').map(w=>{const m=w.match(/^([^A-Za-zÀ-ÿ0-9]*)(.*?)([^A-Za-zÀ-ÿ0-9]*)$/);const pre=m[1],c=m[2],suf=m[3];if(!c)return w;const isF=first;first=false;if(/\d/.test(c)||/^[IVXLC]+$/.test(c)&&c.length<=5&&c===c.toUpperCase()&&/^(I|II|III|IV|V|VI|VII|VIII|IX|X)$/.test(c))return w;const lc=c.toLowerCase();if(!isF&&LOW.has(lc))return pre+lc+suf;const allU=c===c.toUpperCase()&&c!==lc,allL=c===lc;if(allU&&c.length<=(up?3:5))return w;if(allU||allL)return pre+c.charAt(0).toUpperCase()+lc.slice(1)+suf;return w}).join(' ')};

const nzk=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9() ]+/g,' ').replace(/\s+/g,' ').trim();
const SUBAL={'lingua portuguesa e redacao oficial':'portugues','lingua portuguesa':'portugues','educacao inclusiva e lei brasileira de inclusao':'educacao inclusiva','temas educacionais e pedagogicos (planejamento didatica e avaliacao)':'temas educacionais e pedagogicos'};
const subjKey=n=>{const k=nzk(n);return SUBAL[k]||k};
const topKey=s=>nzk(s).replace(/^\d+( \d+)*\s+/,'').replace(/\b(de|da|do|das|dos|e|em|a|o|as|os|na|no|para|por|com)\b/g,' ').replace(/\s+/g,' ').trim();
const topSim=(a,b)=>{const x=topKey(a),y=topKey(b);if(!x||!y)return false;if(x===y)return true;if(Math.min(x.length,y.length)>=10&&(x.includes(y)||y.includes(x)))return true;const A=new Set(x.split(' ')),B=new Set(y.split(' '));let i=0;A.forEach(w=>{if(B.has(w))i++});return i/(A.size+B.size-i)>=0.7};

function fieldHtml(f,v,doc){
  const n='name="'+f.k+'"',val=v==null?'':v,r=f.req?'required':'';
  switch(f.t){
    case 'area':return `<label>${esc(f.l)}</label><textarea ${n} ${f.k==='md'?'data-rich="1"':''} rows="${f.rows||5}" ${r} ${f.mono?'style="font-family:ui-monospace,monospace;font-size:13px"':''}>${esc(val)}</textarea>`;
    case 'steps':return `<label>${esc(f.l)}</label><textarea ${n} rows="${f.rows||5}">${esc((Array.isArray(v)?v:[]).map(x=>x.t).join('\n'))}</textarea>`;
    case 'tags':return `<label>${esc(f.l)}</label><input ${n} value="${esc((Array.isArray(v)?v:[]).join(', '))}">`;
    case 'select':{const o=typeof f.o==='function'?f.o():f.o;const cur=f.bool?(v===false?'0':'1'):String(val);return `<label>${esc(f.l)}</label><select ${n}>${o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===cur?'selected':''}>${esc(b)}</option>`).join('')}</select>`}
    case 'multi':{const o=f.o();const cur=Array.isArray(v)?v:[];return `<label>${esc(f.l)}</label>${o.length?o.map(([a,b])=>`<label class="chk"><input type="checkbox" name="${f.k}" value="${esc(a)}" ${cur.includes(a)?'checked':''}>${esc(b)}</label>`).join(''):'<div class="tiny muted">Nada cadastrado ainda.</div>'}`}
    case 'check':return `<label class="chk"><input type="checkbox" name="${f.k}" value="1" ${v?'checked':''}>${esc(f.l)}</label>`;
    case 'color':return `<label>${esc(f.l)}</label><div class="row">${COLORS.map((c,i)=>`<label class="chk" style="margin:0"><input type="radio" name="${f.k}" value="${c}" ${(v?v===c:i===0)?'checked':''} style="accent-color:${c}"><span style="display:inline-block;width:22px;height:22px;border-radius:50%;background:${c}"></span></label>`).join('')}</div>`;
    case 'date':return `<label>${esc(f.l)}</label><input type="date" ${n} ${r} value="${esc(val)}">`;
    case 'time':return `<label>${esc(f.l)}</label><input type="time" ${n} value="${esc(val)}">`;
    case 'num':return `<label>${esc(f.l)}</label><input type="number" ${n} value="${esc(val)}">`;
    default:return `<label>${esc(f.l)}</label><input ${n} ${r} ${f.list?'list="'+f.list+'"':''} value="${esc(val)}">`;
  }
}
function collect(E,o,fd,doc){
  const d={};
  E.fields.forEach(f=>{
    const v=o[f.k];
    if(f.t==='multi')d[f.k]=fd.getAll(f.k);
    else if(f.t==='check')d[f.k]=o[f.k]==='1';
    else if(f.t==='tags')d[f.k]=String(v||'').split(',').map(x=>x.trim()).filter(Boolean);
    else if(f.t==='steps'){const old=(doc&&doc[f.k])||[];d[f.k]=String(v||'').split('\n').map(x=>x.trim()).filter(Boolean).map(t=>({t,done:!!(old.find(s=>s.t===t)||{}).done}))}
    else if(f.bool)d[f.k]=v==='1';
    else d[f.k]=String(v==null?'':v).trim();
  });
  return d;
}
function datalists(){

async function cascade(c,id){
  if(c==='subjects'){for(const t of S.topics.filter(x=>x.subjectId===id))await del('topics',t.id)}

const TL={notes:'Nota',summaries:'Resumo',materials:'Material',cards:'Card',questions:'Questão',subjects:'Disciplina',topics:'Assunto',concursos:'Concurso',goals:'Meta',projects:'Projeto',tasks:'Tarefa',events:'Compromisso',journal:'Diário',errnotes:'Caderno de erros',inbox:'Caixa de entrada'};
function titleOf(c,d){return d.title||d.name||d.front||clip(d.statement,80)||clip(d.text,80)||'(sem título)'}
function bodyOf(c,d){
  switch(c){
    case 'notes':case 'summaries':return d.md||'';
    case 'materials':return d.text||'';
    case 'cards':return (d.front||'')+'\n'+(d.back||'');
    case 'questions':return [d.statement,d.alts,d.comment,d.why].filter(Boolean).join('\n');
    case 'journal':return d.text||'';
    case 'inbox':return d.text||'';
    case 'goals':return (d.desc||'')+'\n'+(d.steps||[]).map(s=>s.t).join('\n');
    case 'projects':return d.desc||'';
    case 'tasks':return d.notes||'';
    case 'concursos':return [d.cargo,d.banca,d.edital].filter(Boolean).join(' ');
    default:return '';
  }
}
function allItems(){
  const out=[];
  for(const c of Object.keys(TL))for(const d of S[c]){out.push({c,id:d.id,title:titleOf(c,d),body:bodyOf(c,d),tags:(d.tags||[]).join(' '),d})}
  return out;
}
function searchItems(query,types,limit=40){
  const toks=norm(query).split(/\s+/).filter(Boolean);if(!toks.length)return[];
  const r=[];
  for(const it of allItems()){
    if(types&&types.length&&!types.includes(it.c))continue;
    const t=norm(it.title),b=norm(it.body),g=norm(it.tags);let sc=0,ok=true;
    for(const k of toks){let s=0;if(t.includes(k))s+=10;if(g.includes(k))s+=6;if(b.includes(k))s+=Math.min(5,1+((b.split(k).length-1)>>1));if(!s){ok=false;break}sc+=s}
    if(ok)r.push({it,sc});
  }
  return r.sort((a,b)=>b.sc-a.sc).slice(0,limit).map(x=>{const b=x.it.body,i=norm(b).indexOf(toks[0]);return Object.assign({},x.it,{snip:clip(i>=0?b.slice(Math.max(0,i-40),i+120):b,140)})});
}
function relatedTo(c,id){
  const it=get(c,id);if(!it)return{out:[],back:[]};
  const key=c+':'+id,tl=norm(titleOf(c,it));
  const out=(it.links||[]).map(k=>{const [cc,ii]=k.split(':');const d=get(cc,ii);return d?{c:cc,id:ii,title:titleOf(cc,d)}:null}).filter(Boolean);
  const back=allItems().filter(x=>!(x.c===c&&x.id===id)&&((x.d.links||[]).includes(key)||(tl.length>2&&norm(x.body).includes('[['+tl+']]')))).map(x=>({c:x.c,id:x.id,title:x.title}));
  return {out,back};
}

/* ---- edição por seção e comentários no resumo ---- */
function mdSecs(t){
  const L=String(t||'').split('\n'),hs=[];let fence=false;
  L.forEach((l,i)=>{if(/^\s*(```|~~~)/.test(l)){fence=!fence;return}if(fence)return;const m=l.match(/^(#{1,6})\s+(.*)$/);if(m)hs.push({i,lvl:m[1].length,title:m[2].trim()})});
  const out=[{i:-1,lvl:0,title:'Início do resumo',s:0,e:hs.length?hs[0].i:L.length}];
  hs.forEach((h,k)=>out.push({i:h.i,lvl:h.lvl,title:h.title,s:h.i+1,e:k+1<hs.length?hs[k+1].i:L.length}));
  return {L,secs:out};
}
async function saveMdDoc(c,d,md2){
  if(d._vols){
    const p=md2.split(/\n\n<!--nxvol:([^>]+)-->\n\n/),ids=[],mds=[p[0]];for(let i=1;i<p.length;i+=2){ids.push(p[i]);mds.push(p[i+1]||'')}
    if(ids.join('|')!==d._vols.join('|')){toast('Não apague as marcas de volume do resumo (linhas <!--nxvol…-->).');return false}
    if(mds.some(x=>new TextEncoder().encode(x).length>245000)){toast('Um dos volumes ficou grande demais para salvar.');return false}
    const olds=[d._mdOne].concat(d._vols.map(id=>(VOLDOC[id]||{}).md||'')),dids=[d.id].concat(d._vols);
    for(let i=0;i<dids.length;i++){if(mds[i]===olds[i])continue;const cur=get(c,dids[i])||{};const hist=[{t:Date.now(),md:olds[i]}].concat(cur.hist||[]).slice(0,4);await patch(c,dids[i],{md:mds[i],hist,updatedAt:Date.now()})}
    return true;
  }
  if(new TextEncoder().encode(md2).length>245000){toast('Texto grande demais para salvar (limite ~240 mil caracteres).');return false}
  const hist=[{t:Date.now(),md:d.md||''}].concat(d.hist||[]).slice(0,8);
  await patch(c,d.id,{md:md2,hist,updatedAt:Date.now()});return true;
}

ACT.secedit=b=>{
  const c=b.dataset.c,d=get(c,b.dataset.id),k=+b.dataset.k,{L,secs}=mdSecs(d.md),s=secs[k];if(!s)return;
  const body=L.slice(s.s,s.e).join('\n').replace(/^\n+|\n+$/g,'');
  sheet('Editar: '+clip(s.title,40),`<div class="tiny muted" style="margin-bottom:6px">Só o texto desta seção (até o próximo título). Markdown permitido.</div>${s.i>=0?`<label class="tiny muted">Título</label><input name="ttl" value="${esc(s.title)}">`:''}<textarea name="body" data-rich="1" rows="14" style="width:100%;min-height:260px">${esc(body)}</textarea>`,async f=>{
    const cur=get(c,d.id),m2=mdSecs(cur.md),s2=m2.secs[k];if(!s2||s2.title!==s.title){toast('O resumo mudou; reabra a seção.');return false}
    const head=s2.i>=0?[ '#'.repeat(s2.lvl)+' '+(f.ttl||s2.title).trim() ]:[];
    const nb=String(f.body||'').replace(/\s+$/,'');
    const L2=m2.L.slice(0,Math.max(s2.i,0)).concat(head,nb?[nb,'']:[''],m2.L.slice(s2.e));
    const r=await saveMdDoc(c,cur,L2.join('\n'));if(r)toast('Seção salva');return r;
  },{wide:true});
};
async function addComment(c,id,k,txt){
  const cur=get(c,id),{L,secs}=mdSecs(cur.md),s=secs[k];if(!s)return false;
  const dt=new Date().toLocaleDateString('pt-BR');
  const q=['> 💬 **Comentário ('+dt+'):** '+String(txt).trim().split('\n').join('\n> ')];
  let at=s.e;while(at>s.s&&!String(L[at-1]).trim())at--;

/* ---- buscar palavras no resumo aberto ---- */
const FND={hits:[],i:-1};
function fndClear(){document.querySelectorAll('mark.fnd').forEach(m=>{const p=m.parentNode;if(!p)return;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize()});FND.hits=[];FND.i=-1}
function fndCount(){const e=document.getElementById('fndn');if(e)e.textContent=FND.hits.length?(FND.i+1)+'/'+FND.hits.length:'0'}
function fndGo(d){if(!FND.hits.length)return;FND.hits.forEach(m=>m.classList.remove('cur'));FND.i=(FND.i+d+FND.hits.length)%FND.hits.length;const m=FND.hits[FND.i];m.classList.add('cur');m.scrollIntoView({block:'center'});fndCount()}
function fndRun(q){
  fndClear();const nq=String(q||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');if(nq.length<2){fndCount();return}
  const root=document.querySelector('#main article.md')||document.getElementById('main');if(!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest('script,style,mark')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}),nodes=[];
  while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const t=n.nodeValue;let ns='',map=[];for(let i=0;i<t.length;i++){const c=t[i].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();for(const ch of c){ns+=ch;map.push(i)}}
    let from=0,k,ranges=[];while((k=ns.indexOf(nq,from))>=0){const s0=map[k],e0=map[k+nq.length-1]+1;ranges.push([s0,e0]);from=k+nq.length}
    if(!ranges.length)return;const f=document.createDocumentFragment();let last=0;
    ranges.forEach(([a,b])=>{if(a<last)return;if(a>last)f.append(t.slice(last,a));const m=document.createElement('mark');m.className='fnd';m.textContent=t.slice(a,b);f.append(m);FND.hits.push(m);last=b});
    if(last<t.length)f.append(t.slice(last));n.replaceWith(f)});
  FND.i=-1;if(FND.hits.length)fndGo(1);else fndCount()}
ACT.fnd=()=>{let b=document.getElementById('fndbar');if(b){b.querySelector('input').focus();return}
  b=document.createElement('div');b.id='fndbar';b.innerHTML='<input type="search" placeholder="Buscar no resumo" autocomplete="off" aria-label="Buscar no resumo"><span id="fndn" class="tiny muted">0</span><button type="button" class="btn sm" data-fa="p" aria-label="Anterior">▲</button><button type="button" class="btn sm" data-fa="n" aria-label="Próximo">▼</button><button type="button" class="btn sm ghost" data-fa="x" aria-label="Fechar">×</button>';
  document.body.appendChild(b);const i=b.querySelector('input');let tm;
  i.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>fndRun(i.value),200)});
  i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!FND.hits.length)fndRun(i.value);else fndGo(e.shiftKey?-1:1)}else if(e.key==='Escape')ACT.fndx()});

function rdSecs(d){
  const {L,secs}=mdSecs(d.md),seen={},out=[];
  secs.slice(1).forEach((s,i)=>{const b=norm(s.title).replace(/\s+/g,' ').trim().slice(0,80);seen[b]=(seen[b]||0)+1;const w=Math.max(40,L.slice(s.s,s.e).join('\n').length+s.title.length);out.push({k:i+1,key:b+'#'+seen[b],title:s.title,lvl:s.lvl,w})});
  return out;
}
function rdStats(c,d){
  const secs=rdSecs(d),rd=(rdDoc(c,d.id)||{}).items||{},tot=secs.reduce((a,s)=>a+s.w,0)||1;
  let done=0,n=0,last=-1;secs.forEach((s,i)=>{if(rd[s.key]){done+=s.w;n++;last=i}});
  const pct=Math.round(done/tot*100);let next=secs.findIndex((s,i)=>i>last&&!rd[s.key]);if(next<0)next=secs.findIndex(s=>!rd[s.key]);
  return {secs,rd,n,total:secs.length,pct,next:next>=0?secs[next]:null,last:last>=0?secs[last]:null};
}

function heatDash(){
  const t=today(),mins={};S.sessions.forEach(x=>{if(x.date&&(x.minutes||0)>0)mins[x.date]=(mins[x.date]||0)+x.minutes});
  if(T.running)mins[t]=(mins[t]||0)+Math.max(1,Math.round(elapsed()/60000));
  const yr=t.slice(0,4),j1=yr+'-01-01',dec=yr+'-12-31',dow=new Date(j1+'T12:00:00').getDay();
  const start=addDays(j1,-dow),nw=Math.ceil((Math.round((new Date(dec+'T12:00:00')-new Date(start+'T12:00:00'))/864e5)+1)/7);
  const wk=[];for(let w=0;w<nw;w++){const col=[];for(let d=0;d<7;d++){const dt=addDays(start,w*7+d);col.push(dt)}wk.push(col)}
  const lv=m=>!m?0:m<30?1:m<90?2:m<180?3:4,CL=['var(--surface2)','#9be9a8','#40c463','#30a14e','#216e39'];
  const MN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  let last=-1;const labs=wk.map(c=>{const dm=c.find(x=>x>=j1)||c[6],m=+dm.slice(5,7)-1;if(m!==last){last=m;return `<span style="position:absolute;left:0;top:0">${MN[m]}</span>`}return ''});
  const days=Object.keys(mins).filter(k=>k>=j1&&k<=t).length;
  let streak=0,k=t;if(!mins[k])k=addDays(k,-1);while(mins[k]){streak++;k=addDays(k,-1)}
  const cols=wk.map((c,i)=>`<div style="display:flex;flex-direction:column;gap:3px;flex:1 1 0;min-width:12px"><div style="position:relative;height:14px;font-size:10px;color:var(--muted);white-space:nowrap">${labs[i]}</div>${c.map(dt=>dt<j1||dt>dec?'<div style="width:100%;aspect-ratio:1"></div>':`<div data-act="heatd" data-d="${dt}" title="${dt.split('-').reverse().join('/')} · ${mins[dt]?hm(mins[dt]):'Sem estudo'}" style="width:100%;aspect-ratio:1;border-radius:3px;background:${CL[lv(mins[dt])]};${dt>t?'opacity:.45;':''}${dt===t?'outline:1.5px solid var(--accent);':''}cursor:pointer"></div>`).join('')}</div>`).join('');
  setTimeout(()=>{const e=document.getElementById('heatsc'),c=e&&e.querySelector('[data-d="'+t+'"]');if(e&&c)e.scrollLeft=Math.max(0,c.offsetLeft-e.clientWidth/2)},0);
  return `<section class="card sec" style="text-align:center"><h3 class="h2" style="font-size:16px">🟩 Atividade em ${yr}</h3><div class="tiny muted" style="margin-bottom:8px"><b style="color:var(--ok)">${days}</b> dias com estudo · sequência atual: <b>${streak}</b> dia${streak===1?'':'s'}</div><div id="heatsc" style="overflow-x:auto;padding-bottom:4px"><div style="display:flex;gap:3px;min-width:${nw*15}px">${cols}</div></div><div id="heatinfo" class="tiny muted" style="margin:4px 0;min-height:14px"></div><div class="row tiny muted" style="justify-content:center;gap:4px;align-items:center">Menos ${CL.map(c=>`<span style="width:11px;height:11px;border-radius:3px;background:${c};display:inline-block"></span>`).join('')} Mais</div></section>`;
}

/* ---- ciclos de questões por matéria ---- */
const qcyc=()=>cfg().qcyc||{};
function qcycInfo(x){
  const all=S.questions.filter(q=>q.subjectId===x.id),qs=all.filter(q=>String(q.gab||'').trim()),tot=qs.length,an=qs.filter(q=>q.marked),ok=an.filter(isOk).length;
  const st=qcyc()[x.id]||{n:1,hist:[]};
  const lst=qOrder(x,all),seen={},cy=[];
  lst.forEach(q=>{const k=qMixKey(q);seen[k]=(seen[k]||0)+1;const r=Math.min(seen[k],5),c=cy[r-1]||(cy[r-1]={r,tot:0,n:0});if(String(q.gab||'').trim()){c.tot++;if(q.marked)c.n++}});
  const cycles=cy.filter(c=>c&&c.tot>0).map(c=>({...c,done:c.n>=c.tot}));
  const pq=qMix(lst).find(q=>String(q.gab||'').trim()&&!q.marked),pt=pq&&pq.topicId&&get('topics',pq.topicId);
  return {x,tot,n:an.length,ok,cy:st.n||1,hist:st.hist||[],done:tot>0&&an.length>=tot,cycles,curC:cycles.find(c=>!c.done)||null,pend:pq?(pt?pt.name:'Sem assunto'):''};
}
function qcycDash(){

function sdFind(term,next){
  const art=$('#sdb article');if(!art)return;
  art.querySelectorAll('mark.sdhit').forEach(m=>{m.replaceWith(document.createTextNode(m.textContent))});art.normalize();
  term=norm(term).trim();if(term.length<2){sdHits=[];return}
  const w=document.createTreeWalker(art,NodeFilter.SHOW_TEXT),nodes=[];let n;while(n=w.nextNode())nodes.push(n);

  nodes.forEach(t=>{const tx=t.nodeValue,nt=norm(tx);if(nt.length!==tx.length)return;let i=nt.indexOf(term);if(i<0)return;const f=document.createDocumentFragment();let last=0;while(i>=0){f.append(tx.slice(last,i));const m=document.createElement('mark');m.className='sdhit';m.textContent=tx.slice(i,i+term.length);f.append(m);sdHits.push(m);last=i+term.length;i=nt.indexOf(term,last)}f.append(tx.slice(last));t.replaceWith(f)});

}

const LIBS={pdf:['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],docx:['https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'],xlsx:['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'],zip:['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js']};
const loadedLibs={};
function loadLib(k){return loadedLibs[k]||(loadedLibs[k]=Promise.all(LIBS[k].map(u=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('Biblioteca indisponível'));document.head.appendChild(s)}))))}
async function extractText(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(['txt','md','csv','markdown'].includes(ext))return {kind:ext==='md'||ext==='markdown'?'md':'txt',text:await file.text()};
  const buf=await file.arrayBuffer();
  if(ext==='pdf'){await loadLib('pdf');const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;let t='';for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();t+='\n\n[Página '+i+']\n'+c.items.map(x=>x.str).join(' ');if(t.length>150000)break}return {kind:'pdf',text:t.trim(),pages:pdf.numPages}}
  if(ext==='docx'){await loadLib('docx');const r=await mammoth.extractRawText({arrayBuffer:buf});return {kind:'docx',text:r.value}}
  if(ext==='xlsx'){await loadLib('xlsx');const wb=XLSX.read(buf,{type:'array'});return {kind:'xlsx',text:wb.SheetNames.map(n=>'[Planilha '+n+']\n'+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n\n')}}
  if(ext==='pptx'){await loadLib('zip');const z=await JSZip.loadAsync(buf);const names=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));let t='';for(const n of names){const x=await z.files[n].async('string');t+='\n\n[Slide '+parseInt(n.match(/\d+/)[0])+']\n'+(x.match(/<a:t>[^<]*<\/a:t>/g)||[]).map(m=>m.replace(/<\/?a:t>/g,'')).join(' ')}return {kind:'pptx',text:t.trim()}}
  return {kind:'outro',text:''};
}
ACT.newmat=b=>{
  const sid=b.dataset.s||'';
  sheet('Importar material',`<label>Arquivo (PDF, DOCX, TXT, MD, PPTX, XLSX)</label><input type="file" name="file" accept=".pdf,.docx,.txt,.md,.pptx,.xlsx,.csv"><div class="tiny muted">Ou informe um link abaixo.</div>
  <label>Título</label><input name="title"><label>Link (opcional)</label><input name="url" placeholder="https://"><label>Disciplina</label><select name="subjectId">${subjOpts().map(([a,l])=>`<option value="${esc(a)}" ${a===sid?'selected':''}>${esc(l)}</option>`).join('')}</select><label>Assunto</label><select name="topicId">${topicOpts().map(([a,l])=>`<option value="${esc(a)}">${esc(l)}</option>`).join('')}</select>`,async(o,fd)=>{

    await put('materials',id,doc);toast('Material adicionado');
  });
};

const CYC=()=>{const a=((cfg().cycle)||[]).map(Number).filter(n=>n>0);return a.length?a:[1,3,7,15,30,60]};
function stepOf(c){if(typeof c.step==='number')return c.step;let s=0;CYC().forEach((d,i)=>{if((c.interval||0)>=d)s=i});return s}
function nextStep(c,ok){const cy=CYC();return ok?Math.min(stepOf(c)+1,cy.length-1):0}
function grade(c,ok){
  const cy=CYC(),s=nextStep(c,ok),iv=cy[s];
  const hist=(c.hist||[]).concat([{d:today(),ok:!!ok,iv}]).slice(-60);
  patch('cards',c.id,{step:s,interval:iv,reps:(c.reps||0)+(ok?1:0),lapses:(c.lapses||0)+(ok?0:1),due:addDays(today(),iv),last:today(),hist});
}
const dlabel=n=>n+(n===1?' dia':' dias');
function guessSrc(sid,tid,name,jobId){
  const nn=norm(name||''),jobs=(S.method||[]).filter(x=>/^j_/.test(x.id));
  let top=tid?get('topics',tid):null;
  if(!top&&nn)top=S.topics.find(t=>(!sid||t.subjectId===sid)&&norm(t.name)===nn);
  let job=jobId?get('method',jobId):null;
  if(!job)job=jobs.find(j=>(top&&j.topicId===top.id)||(nn&&norm(j.title)===nn));
  const sm=job&&job.summaryId&&get('summaries',job.summaryId);if(sm)return 'summaries:'+sm.id;
  const bt=top&&S.summaries.find(x=>x.topicId===top.id);if(bt)return 'summaries:'+bt.id;
  const bn=nn&&S.summaries.find(x=>(!sid||x.subjectId===sid)&&norm(x.title).includes(nn));if(bn)return 'summaries:'+bn.id;
  if(job)return 'job:'+job.id;
  return '';
}
function srcLink(c){
  let src=c.src;if(src&&src.startsWith('job:')){const j=get('method',src.slice(4));const sm=j&&j.summaryId&&get('summaries',j.summaryId);if(sm)src='summaries:'+sm.id}
  if(!src||!(src.startsWith('job:')?get('method',src.slice(4)):get(...src.split(':'))))src=guessSrc(c.subjectId,'',c.sub,'');
  if(!src)return '';
  const [sc,si]=src.split(':');
  if(sc==='job'){const j=get('method',si);return j&&j.fileUrl?`<a class="btn sm" href="#" data-act="opensrc" data-src="${esc(src)}" data-anchor="">📄 Abrir PDF: ${esc(clip(j.title,48))}</a>`:''}
  const d=get(sc,si);if(!d)return '';
  return `<a class="btn sm" href="#" data-act="opensrc" data-src="${esc(src)}" data-anchor="${esc(c.anchor||'')}" data-q="${esc(((c.front||'')+' '+(c.back||'')).replace(/<[^>]+>/g,' '))}">📖 Abrir no resumo: ${esc(clip(titleOf(sc,d),48))}${c.anchor?' › '+esc(clip(c.anchor,32)):''}</a>`;
}
/* ---- mapa mental vinculado ao card ---- */
const mapOpts=()=>[['','— nenhum (automático) —']].concat(S.maps.slice().sort((a,b)=>String(a.gt||'').localeCompare(String(b.gt||''))||(a.ord||0)-(b.ord||0)).map(m=>[m.id,clip(m.gt||'',34)+' › '+clip(m.title||'',50)]));
function mapGuess(c){
  let src=c.src;if(src&&src.startsWith('job:')){const j=get('method',src.slice(4));const sm=j&&j.summaryId&&get('summaries',j.summaryId);src=sm?'summaries:'+sm.id:''}
  if(!src)src=guessSrc(c.subjectId,'',c.sub,'');
  let ms=src?S.maps.filter(m=>m.srcId===src):[];
  if(!ms.length&&c.sub){const nn=norm(c.sub);if(nn.length>3)ms=S.maps.filter(m=>{const g=norm(m.gt||'');return g&&(g.includes(nn)||nn.includes(g))})}
  if(!ms.length)return '';
  ms=ms.slice().sort((a,b)=>(a.ord||0)-(b.ord||0));
  const hub=ms[0],subs=ms.filter(m=>m!==hub||ms.length===1),ws=[...new Set(norm((c.front||'')+' '+(c.back||'')).split(/[^a-z0-9]+/).filter(w=>w.length>=5))];
  let best=null,bs=0;
  subs.forEach(m=>{const t=norm(m.title||''),o=norm((m.outline||'').replace(/\{[^}]*\}/g,' '));let sc=0;ws.forEach(w=>{if(t.includes(w))sc+=3;else if(o.includes(w))sc+=1});sc=sc/Math.sqrt(Math.max(o.length,300)/300);if(sc>bs){bs=sc;best=m}});
  return (best&&bs>=1.5?best:hub).id;
}
function mapLink(c){
  let id=c.mapId&&get('maps',c.mapId)?c.mapId:'';if(!id)try{id=mapGuess(c)}catch(e){id=''}
  const m=id&&get('maps',id);if(!m)return '';
  return `<a class="btn sm" href="#" data-act="cardmap" data-id="${m.id}">🧠 Mapa mental: ${esc(clip(m.title,46))}</a>`;
}

/* editor visual (tipo Word) para o verso do flashcard: edita o texto formatado; salva como markdown */
function h2m(root){
  const W=(n)=>{let o='';n.childNodes.forEach(c=>{o+=N(c)});return o};
  const LI=(ul,pre)=>{let i=0,o='';const ord=ul.tagName.toLowerCase()==='ol';ul.childNodes.forEach(c=>{if(c.tagName&&c.tagName.toLowerCase()==='li'){i++;const mk=ord?i+'. ':'- ';let txt='',sub='';c.childNodes.forEach(ch=>{if(ch.nodeType===1&&/^(ul|ol)$/i.test(ch.tagName))sub+=LI(ch,pre+' '.repeat(mk.length));else txt+=N(ch)});o+=pre+mk+txt.trim().replace(/\n+/g,' ')+'\n'+sub}});return o};
  const N=(n)=>{if(n.nodeType===3)return n.nodeValue.replace(/ /g,' ');if(n.nodeType!==1)return'';
    const t=n.tagName.toLowerCase(),k=W(n);
    if(t==='br')return'\n';
    if(t==='strong'||t==='b')return k.trim()?'**'+k.trim()+'**':'';
    if(t==='em'||t==='i')return k.trim()?'*'+k.trim()+'*':'';
    if(t==='mark')return k.trim()?'=='+k.trim()+'==':'';
    if(t==='code')return '`'+k+'`';
    if(t==='a'&&n.classList.contains('wl'))return '[['+n.textContent+']]';
    if(/^h[1-6]$/.test(t))return '\n\n'+'#'.repeat(+t[1])+' '+k.trim()+'\n\n';
    if(t==='ul'||t==='ol')return '\n'+LI(n,'')+'\n';
    if(t==='pre')return '\n\n```\n'+n.textContent.replace(/\n$/,'')+'\n```\n\n';

function mtkAulaRaw(e){e=String(e||'');const a=e.match(/aulas?\s+(\d+(?:\.\d+)?)/i);if(a)return +a[1];if(/aula\s+extra/i.test(e))return /sql/i.test(e)?98:99;return null}

  const am=mtkAulaRaw(m.escopo);if(am!=null){const n=am,c=S.topics.filter(t=>t.subjectId===sj.id&&(t.aulas||[]).includes(n)).sort((a,b)=>(a.order||0)-(b.order||0));if(c.length>1){const qq=(String(m.escopo||'').match(/[“"]([^”"]+)[”"]/g)||[]).join(' '),qs=[...new Set(mtkStem(qq))];let bt=c[0],bs=0;c.forEach(t=>{const a=new Set(mtkStem((t.tt||'')+' '+(t.name||'')+' '+(t.ts||'')));const sc=qs.filter(w=>a.has(w)).length;if(sc>bs){bs=sc;bt=t}});return bt}if(c.length)return c[0]}

    const P=V.qper||'sem',tdy=today(),MN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

    if(P==='dia'||P==='mes'){const N=P==='dia'?14:30;for(let k=N-1;k>=0;k--){const d=addDays(tdy,-k);bk.push([d,d,d.slice(8)+(P==='dia'||d.slice(8)==='01'||k===0?'/'+d.slice(5,7):'')])}}
    else if(P==='sem'||P==='3m'){const N=P==='sem'?8:13;for(let k=N-1;k>=0;k--){const w=addDays(weekStart(),-7*k);bk.push([w,addDays(w,6),w.slice(8)+'/'+w.slice(5,7)])}}
    else{const N=P==='6m'?6:12;for(let k=N-1;k>=0;k--){const a=addMonths(tdy,-k),e=addDays(addMonths(a,1),-1);bk.push([a,e,MN[+a.slice(5,7)-1]+(a.slice(5,7)==='01'||k===N-1?"'"+a.slice(2,4):'')])}}
    const ALLA=S.questions.filter(DF).flatMap(q=>[...(q.past||[]).map(p=>({marked:p.m,gab:q.gab,date:p.date})),...(q.marked?[q]:[])]);

    const Wd=520,H=140,bw=Wd/weeks.length,many=weeks.length>14,step=weeks.length>20?3:weeks.length>14?2:1;
    const ch=weeks.map(([w,s],i)=>{const h=Math.round(s.pct/100*(H-34)),mg=Math.min(8,bw*.15);return `<rect x="${i*bw+mg}" y="${H-20-h}" width="${bw-2*mg}" height="${Math.max(h,2)}" rx="3" fill="${s.pct<60?'var(--bad)':'var(--ok)'}" opacity="${s.n?1:.2}"><title>${w}: ${s.n?s.ok+'/'+s.n+' · '+s.pct+'%':'sem questões'}</title></rect>${i%step===0||i===weeks.length-1?`<text x="${i*bw+bw/2}" y="${H-5}" text-anchor="middle" style="font-size:${many?8:11}px">${w}</text>`:''}${s.n&&!many?`<text x="${i*bw+bw/2}" y="${H-24-h}" text-anchor="middle" style="fill:var(--fg)">${s.pct}%</text>`:''}`}).join('');
    const pb=[['dia','Diária'],['sem','Semanal'],['mes','1 mês'],['3m','3 meses'],['6m','6 meses'],['1a','1 ano']].map(([k,l])=>`<button class="chip ${P===k?'sel':''}" data-act="qper" data-k="${k}">${l}</button>`).join('');
    const tot=qStats(ALLA.filter(q=>q.date>=bk[0][0]&&q.date<=bk[bk.length-1][1]));
    body=`${dsel}<div class="kpis"><div class="kpi k1"><span>Questões</span><b>${st.n}</b></div><div class="kpi k4"><span>Acertos</span><b>${st.n?st.pct+'%':'—'}</b></div><div class="kpi k3"><span>Erros</span><b>${st.n?100-st.pct+'%':'—'}</b></div></div>
    <div class="sec"><h2>Evolução de acertos</h2><div class="scroll-x" style="margin:6px 0;gap:6px;display:flex">${pb}</div><div class="tiny muted" style="margin-bottom:6px">No período: ${tot.n?tot.ok+' de '+tot.n+' certas · '+tot.pct+'%':'nenhuma questão respondida'}</div><div class="card"><svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Percentual de acertos por semana">${ch}</svg></div></div>
    <div class="grid w2 sec"><div class="card"><h3 class="h2" style="font-size:16px">Por disciplina</h3>${subj.length?subj.map(x=>`<div style="margin-bottom:10px"><div class="row"><span class="grow">${esc(x.name)}</span><span class="tiny muted">${x.ok}/${x.n} · ${x.pct}%</span></div><div class="bar"><i style="width:${x.pct}%;background:${x.pct<60?'var(--bad)':'var(--ok)'}"></i></div></div>`).join(''):'<span class="muted">Sem dados.</span>'}</div>
    <div class="card"><h3 class="h2" style="font-size:16px">Principais dificuldades (assuntos)</h3>${topics.length?topics.slice(0,8).map(x=>`<div style="margin-bottom:10px"><div class="row"><span class="grow">${esc(x.name)}</span><span class="tiny muted">${x.pct}% de ${x.n}</span></div><div class="bar"><i style="width:${x.pct}%;background:${x.pct<60?'var(--bad)':'var(--ok)'}"></i></div></div>`).join(''):'<span class="muted">Vincule as questões a assuntos para ver aqui.</span>'}</div>
    <div class="card"><h3 class="h2" style="font-size:16px">Tipos de erro</h3>${Object.keys(errs).length?Object.entries(errs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" style="margin-bottom:6px"><span class="grow">${esc(k)}</span><span class="chip p2">${v}</span></div>`).join(''):'<span class="muted">Classifique os erros ao registrar.</span>'}</div></div>
    ${ADMIN?'<div class="row sec"><button class="btn pri" data-act="aiq" data-q="erros">Analisar meus erros com a IA</button></div>':''}`;
  }
  const QH=(()=>{try{return localStorage.getItem('nx-qhd')==='1'}catch(e){return false}})(),QN={res:'Resolver',reg:'Registro',des:'Desempenho'}[V.qm]||'',QF=V.qm==='res'?`<button class="chip ${V.qsc?'':'sel'}" data-act="qsc" title="Mostrar ou ocultar disciplina e assunto">🎚 Filtros</button>`:'';
  return (QH?`<div class="row" style="margin:8px 0;gap:8px"><button class="chip" data-act="qhd">▾ Questões · ${QN}</button></div>`:head('Questões',`<button class="btn pri sm" data-act="new" data-c="questions">Registrar questão</button>`)+`<div class="row" style="margin-top:8px;gap:8px;flex-wrap:nowrap"><div class="seg grow" style="flex:1"><button class="${V.qm==='res'?'on':''}" data-act="qm" data-k="res">Resolver</button><button class="${V.qm==='reg'?'on':''}" data-act="qm" data-k="reg">Registro</button><button class="${V.qm==='des'?'on':''}" data-act="qm" data-k="des">Desempenho</button></div><button class="btn sm ghost" data-act="qhd" title="Minimizar o cabeçalho" aria-label="Minimizar" style="flex:none">▴</button></div>`)+`${V.qm==='reg'?`<div class="row" style="margin:12px 0"><select id="qsub" class="grow" aria-label="Disciplina">${subOpts}</select></div>`:''}<div class="sec">${body}</div>`;
};

V.pt='inbox';V.pf='';
VIEWS.projects=()=>{
  if(V.p.tab){V.pt=V.p.tab;if(V.p.proj)V.pf=V.p.proj;V.p={}}
  const tabs=[['inbox','Caixa de entrada ('+S.inbox.length+')'],['kanban','Kanban'],['lista','Lista'],['cal','Calendário'],['linha','Linha do tempo']];
  const tasks=S.tasks.filter(t=>!V.pf||t.projectId===V.pf);
  let body='';
  if(V.pt==='inbox'){
    body=`<form class="row" id="inboxForm" style="margin:12px 0"><input id="inboxIn" class="grow" placeholder="Anote uma ideia ou tarefa e aperte Enter" aria-label="Captura rápida"><button class="btn pri" type="submit">Capturar</button></form>${S.inbox.length?`<div class="list">${by(S.inbox,'createdAt','desc').map(i=>`<div class="item"><span class="t">${esc(i.text)}</span><button class="btn sm" data-act="inb" data-k="task" data-id="${i.id}">Tarefa</button><button class="btn sm" data-act="inb" data-k="idea" data-id="${i.id}">Ideia</button><button class="btn sm" data-act="inb" data-k="note" data-id="${i.id}">Nota</button><button class="btn sm ghost" data-act="inb" data-k="x" data-id="${i.id}" aria-label="Descartar">×</button></div>`).join('')}</div>`:empty('Caixa vazia','Capture sem pensar em onde guardar. Organize depois.')}`;
  }else if(V.pt==='kanban'){
    const cols=[['todo','A fazer'],['doing','Em andamento'],['done','Concluídas']];
    body=`<div class="kan sec">${cols.map(([k,l],ci)=>{const a=tasks.filter(t=>(t.status||'todo')===k&&!t.parentId);return `<div class="kcol" data-drop="${k}"><h4><span>${l}</span><span>${a.length}</span></h4>${a.map(t=>`<div class="kcard" draggable="true" data-drag="${t.id}"><b>${esc(t.title)}</b><div class="row"><span class="chip p${t.prio||2}">${P3.find(x=>x[0]==(t.prio||2))[1]}</span>${t.due?`<span class="chip ${t.due<today()&&k!=='done'?'p1':''}">${fdate(t.due)}</span>`:''}${t.projectId?`<span class="chip">${esc((get('projects',t.projectId)||{}).name||'')}</span>`:''}</div><div class="row">${ci>0?`<button class="btn sm" data-act="tmove" data-id="${t.id}" data-s="${cols[ci-1][0]}" aria-label="Mover para ${cols[ci-1][1]}">←</button>`:''}${ci<2?`<button class="btn sm" data-act="tmove" data-id="${t.id}" data-s="${cols[ci+1][0]}" aria-label="Mover para ${cols[ci+1][1]}">→</button>`:''}<button class="btn sm ghost" data-act="edit" data-c="tasks" data-id="${t.id}">Editar</button></div></div>`).join('')}</div>`}).join('')}</div>`;
  }else if(V.pt==='lista'){
    const top=tasks.filter(t=>!t.parentId);
    const groups=[...new Set(top.map(t=>t.projectId||''))];
    body=top.length?groups.map(pid=>`<h3 class="h2" style="font-size:15px;margin:16px 0 8px">${esc((get('projects',pid)||{name:'Sem projeto'}).name)}</h3><div class="list">${by(top.filter(t=>(t.projectId||'')===pid),'due').sort((a,b)=>(a.status==='done')-(b.status==='done')).map(t=>taskRow(t)+S.tasks.filter(s=>s.parentId===t.id).map(s=>taskRow(s,1)).join('')).join('')}</div>`).join(''):empty('Sem tarefas','Crie projetos e tarefas, com subtarefas, prazos e prioridades.');
  }else if(V.pt==='cal'){
    body=`<div class="sec">${monthGrid(V.pcal||today(),d=>tasks.filter(t=>t.due===d).map(t=>({k:'task',t:t.title})),'pcal')}</div>`;
  }else{
    const ps=S.projects.filter(p=>p.due||S.tasks.some(t=>t.projectId===p.id&&t.due));
    const all=[];ps.forEach(p=>{const ts=S.tasks.filter(t=>t.projectId===p.id&&t.due);all.push(p.due||'',p.createdAt?dstr(new Date(p.createdAt)):today(),...ts.map(t=>t.due))});
    const a=all.filter(Boolean).sort(),min=a[0]||today(),max=a[a.length-1]||today();const span=Math.max(1,(new Date(max)-new Date(min))/864e5);
    const pos=d=>Math.max(0,Math.min(100,(new Date(d)-new Date(min))/864e5/span*100));
    body=ps.length?`<div class="tl sec"><div class="tiny muted">${fdate(min)} → ${fdate(max)}</div>${ps.map(p=>{const st=p.createdAt?dstr(new Date(p.createdAt)):min,en=p.due||st;const ts=S.tasks.filter(t=>t.projectId===p.id&&t.due);return `<div class="tlrow"><span>${esc(p.name)}</span><div class="tlbar"><i style="left:${pos(st)}%;width:${Math.max(1.5,pos(en)-pos(st))}%"></i>${ts.map(t=>`<span title="${esc(t.title)}" style="position:absolute;top:3px;left:${pos(t.due)}%;width:10px;height:14px;border-radius:50%;background:${t.status==='done'?'var(--ok)':'var(--gold)'}"></span>`).join('')}</div></div>`}).join('')}<div class="tiny muted">Barras: do início ao prazo do projeto. Pontos: prazos das tarefas.</div></div>`:empty('Sem datas','Defina prazos em projetos e tarefas para ver a linha do tempo.');
  }
  return head('Projetos e tarefas',`<button class="btn sm" data-act="new" data-c="projects">Novo projeto</button><button class="btn pri sm" data-act="new" data-c="tasks" ${V.pf?`data-d='{"projectId":"${V.pf}"}'`:''}>Nova tarefa</button>`)+
  `<div class="seg" style="margin-top:8px">${tabs.map(([k,l])=>`<button class="${V.pt===k?'on':''}" data-act="ptab" data-k="${k}">${l}</button>`).join('')}</div>
  ${V.pt!=='inbox'?`<div class="row" style="margin-top:10px"><select id="pf" style="max-width:280px" aria-label="Filtrar projeto"><option value="">Todos os projetos</option>${S.projects.map(p=>`<option value="${p.id}" ${V.pf===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>${V.pf?`<button class="btn sm" data-act="edit" data-c="projects" data-id="${V.pf}">Editar projeto</button>`:''}</div>`:''}${body}`;
};
function taskRow(t,sub){return `<div class="item ${t.status==='done'?'done':''}" ${sub?'style="margin-left:24px;width:calc(100% - 24px)"':''}><input type="checkbox" data-act="tdone" data-id="${t.id}" ${t.status==='done'?'checked':''} aria-label="Concluir"><button class="t" style="border:0;background:none;text-align:left;padding:0" data-act="edit" data-c="tasks" data-id="${t.id}">${esc(t.title)}${t.due?` <span class="tiny muted">· ${fdate(t.due)}</span>`:''}</button><span class="chip p${t.prio||2}">${P3.find(x=>x[0]==(t.prio||2))[1]}</span></div>`}
ACT.ptab=b=>{V.pt=b.dataset.k;render()};

/* ---- calendário e agenda ---- */
V.ag={mode:'mes',date:today()};
function monthGrid(date,fn,key){
  const d=new Date(date+'T12:00:00'),y=d.getFullYear(),m=d.getMonth();
  const first=new Date(y,m,1),start=weekStart(dstr(first));
  const cells=[];for(let i=0;i<42;i++){const x=addDays(start,i);cells.push(x)}
  const title=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  return `<div class="row" style="margin-bottom:8px"><button class="btn sm" data-act="calnav" data-key="${key}" data-n="-1">←</button><b class="grow" style="text-align:center;text-transform:capitalize">${title}</b><button class="btn sm" data-act="calnav" data-key="${key}" data-n="1">→</button></div>
  <div class="cal">${['seg','ter','qua','qui','sex','sáb','dom'].map(x=>`<div class="dh">${x}</div>`).join('')}${cells.map(x=>{const ev=fn(x);return `<button class="day ${new Date(x+'T12:00:00').getMonth()!==m?'out':''} ${x===today()?'today':''}" data-act="dayopen" data-d="${x}"><b>${+x.slice(8)}</b>${ev.slice(0,3).map(e=>`<span class="ev ${e.k}">${esc(e.t)}</span>`).join('')}${ev.length>3?`<span class="tiny muted">+${ev.length-3}</span>`:''}</button>`}).join('')}</div>`;
}
ACT.calnav=b=>{const k=b.dataset.key;const cur=new Date((V[k]||(k==='pcal'?today():V.ag.date))+'T12:00:00');cur.setMonth(cur.getMonth()+ +b.dataset.n);cur.setDate(1);if(k==='pcal')V.pcal=dstr(cur);else V.ag.date=dstr(cur);render()};
function dayEntries(d){

function reportText(k){
  const t=today(),from=k==='semana'?weekStart():t;
  const days=[];for(let d=from;d<=t;d=addDays(d,1))days.push(d);
  const mins=days.reduce((a,d)=>a+minutesOn(d),0);
  let rev=0,revOk=0;S.cards.forEach(c=>(c.hist||[]).forEach(h=>{if(h.d>=from&&h.d<=t){rev++;if(h.ok)revOk++}}));
  const qs=qAns().filter(q=>q.date>=from&&q.date<=t),qk=qs.filter(isOk).length;
  const done=S.tasks.filter(x=>x.status==='done'&&x.doneAt&&x.doneAt>=from&&x.doneAt<=t);
  const al=alerts().filter(x=>x.lvl!=='info');
  return `# Relatório ${k==='semana'?'da semana':'do dia'} · ${fdate(from)}${k==='semana'?' a '+fdate(t):''}\n\n## Estudos\n- Tempo estudado: ${Math.floor(mins/60)}h${pad(mins%60)}\n- Cards revisados: ${rev}${rev?' ('+Math.round(revOk/rev*100)+'% de acerto)':''}\n- Questões resolvidas: ${qs.length}${qs.length?' ('+Math.round(qk/qs.length*100)+'% de acerto)':''}\n- Resumos criados ou editados: ${S.summaries.filter(x=>x.updatedAt&&dstr(new Date(x.updatedAt))>=from).length}\n\n## Produtividade\n- Tarefas concluídas: ${done.length}\n${done.map(x=>'  - '+x.title).join('\n')}\n- Tarefas abertas: ${S.tasks.filter(taskOpen).length}\n- Metas em andamento: ${S.goals.filter(g=>goalProg(g)<100).length}\n\n## Pontos de atenção\n${al.length?al.map(x=>'- '+x.txt).join('\n'):'- Nenhum alerta.'}\n`;
}
ACT.report=b=>{
  const k=b.dataset.k||'dia';const txt=reportText(k);
  sheet('Relatório '+(k==='semana'?'da semana':'do dia'),`<article class="md">${md(txt)}</article>`,()=>{},{wide:1,noSave:true,save:'Fechar',nofocus:true,extra:`<button type="button" class="btn" data-act="copyrep" data-k="${k}">Copiar</button><button type="button" class="btn" data-act="dlrep" data-k="${k}">Baixar .md</button><button type="button" class="btn" data-act="airep" data-k="${k}">Analisar com IA</button>`});
};
ACT.copyrep=b=>copyText(reportText(b.dataset.k));
ACT.dlrep=b=>download('relatorio-'+b.dataset.k+'-'+today()+'.md',reportText(b.dataset.k));
ACT.airep=b=>{closeSheet();aiRun('Analise o relatório abaixo, aponte o que foi bem, o que está atrasado e proponha 3 ações para os próximos dias. Use as ferramentas para conferir dados reais antes de afirmar.\n\n'+reportText(b.dataset.k))};

  const t=o.text.trim();if(!t){toast('Escreva algo');return false}
  if(o.as==='inbox')await put('inbox',uid(),{text:t,createdAt:Date.now()});
  else if(o.as==='task')await put('tasks',uid(),{title:t,status:'todo',prio:'2',createdAt:Date.now(),updatedAt:Date.now()});
  else if(o.as==='journal')await put('journal',uid(),{date:today(),kind:'pensamento',text:t,createdAt:Date.now()});
  else await put('notes',uid(),{title:clip(t,70),kind:o.as,md:t,tags:[],folder:'',createdAt:Date.now(),updatedAt:Date.now()});
  toast('Guardado');
},{save:'Guardar'});

/* atalhos da revisão de flashcards: Espaço/Enter = mostrar resposta · 1 ou ← = errei · 2 ou → = acertei · Z = voltar ao card anterior */
document.addEventListener('keydown',e=>{
  if(V.view!=='cards'||(V.cmode||'revisar')!=='revisar'||e.ctrlKey||e.metaKey||e.altKey)return;
  const tag=(e.target.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag)||(e.target.isContentEditable))return;
  const sh=$('#sheet');if(sh&&!sh.hidden)return;
  const k=e.key,has=!!document.querySelector('[data-act=reveal],[data-act=grade]');
  if(!V.rev)return;
  if((k===' '||k==='Enter')&&document.querySelector('[data-act=reveal]')){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();ACT.reveal();return}
  if(document.querySelector('[data-act=grade]')){
    if(k==='1'||k==='ArrowLeft'){e.preventDefault();ACT.grade({dataset:{ok:'0'}});return}
    if(k==='2'||k==='ArrowRight'){e.preventDefault();ACT.grade({dataset:{ok:'1'}});return}
  }
  if((k==='z'||k==='Z')&&document.querySelector('[data-act=revback]')){e.preventDefault();ACT.revback();return}
  if((k===' '||k==='Enter')&&has)e.preventDefault();
});
/* atalhos */
let gPending=0;
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(),typing=['input','textarea','select'].includes(tag);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(e.key==='Escape'){closePalette();closeSheet();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();openPalette();return}
  if(e.key==='n'){e.preventDefault();ACT.capture();return}
  if(gPending&&Date.now()-gPending<1200){const m={d:'dash',k:'kb',e:'study',f:'cards',q:'questions',m:'goals',p:'projects',a:'agenda',j:'journal',i:'ai',s:'settings'}[e.key];gPending=0;if(m){go(m,{})}return}
  if(e.key==='g')gPending=Date.now();
});

const isCyc=x=>x.id==='main'||String(x.id).startsWith('c_');
const cycles=()=>S.plan.filter(isCyc);
const curId=()=>{const cs=cycles(),a=(get('plan','meta')||{}).active;return cs.find(c=>c.id===a)?a:(cs[0]&&cs[0].id)||null};
const PL=()=>get('plan',curId())||{blocks:[],done:{},lap:1,laps:0,name:'Meu ciclo'};
const blName=b=>{const sj=b.subjectId&&get('subjects',b.subjectId);return sj?sj.name:(b.title||'Outra')};
async function savePlan(o){
  let id=curId();const base=id?strip(PL()):{blocks:[],done:{},lap:1,laps:0,name:'Meu ciclo'};
  if(!id){id='c_'+uid();await put('plan','meta',{active:id})}
  await put('plan',id,Object.assign({},base,o));
}
const dayRec=d=>(get('plan','d_'+d)||{}).ids||[];
async function setDay(d,ids){if(ids.length)await put('plan','d_'+d,{date:d,ids});else if(get('plan','d_'+d))await del('plan','d_'+d)}
ACT.plchk=async b=>{
  const id=b.dataset.id,p=PL(),B=p.blocks||[];if(!B.find(x=>x.id===id))return;
  const done=Object.assign({},p.done||{}),t=today();
  if(done[id]){const d0=done[id];delete done[id];await setDay(d0,dayRec(d0).filter(x=>x!==id));await savePlan({done});return}
  done[id]=t;await setDay(t,[...new Set(dayRec(t).concat(id))]);
  if(B.every(x=>done[x.id])){await savePlan({done:{},lap:(p.lap||1)+1,laps:(p.laps||0)+1});toast('Volta '+(p.lap||1)+' concluída 🎉 Nova volta iniciada')}
  else await savePlan({done});
};
function blockForm(id){
  const b=(PL().blocks||[]).find(x=>x.id===id)||{};
  sheet(id?'Editar matéria':'Nova matéria no ciclo',`<label>Disciplina</label><select name="subjectId"><option value="">Outra (digitar o nome)</option>${S.subjects.map(s=>`<option value="${s.id}" ${b.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><label>Nome (se for “Outra”)</label><input name="title" value="${esc(b.title||'')}" placeholder="Ex.: Revisão de questões"><label>Observação (opcional)</label><input name="note" value="${esc(b.note||'')}" placeholder="Ex.: teoria + 20 questões">`,async o=>{
    if(!o.subjectId&&!(o.title||'').trim()){toast('Escolha a disciplina ou digite um nome');return false}
    const nb={id:id||uid(),subjectId:o.subjectId||'',title:(o.title||'').trim(),note:(o.note||'').trim()};
    const B=(PL().blocks||[]).slice();const i=B.findIndex(x=>x.id===nb.id);if(i>=0)B[i]=nb;else B.push(nb);
    await savePlan({blocks:B});
  },{extra:id?`<button type="button" class="btn bad" data-act="pldel" data-id="${id}" style="margin-right:auto">Excluir</button>`:''});
}

function jobText(d){const parts=(d.parts||[]).map((p,i)=>(get('method','jt_'+d.id+'_'+i)||{}).text||'');const len=parts.reduce((a,x)=>a+x.length,0),c=_jt[d.id];if(c&&c.len===len)return c.text;const text=parts.join('\n\n');_jt[d.id]={len,text};return text}
const msrc=s=>{const [c,id]=String(s.src||':').split(':');const d=srcDoc(c,id);if(!d)return null;
  if(c==='passo')return{c,id,d,title:d.title||'Passo Estratégico',isMd:false,text:d.text||''};
  if(c==='job')return{c,id,d,title:d.title||'PDF',isMd:false,isJob:true,text:jobText(d)};
  return{c,id,d,title:titleOf(c,d),isMd:c!=='materials',text:bodyOf(c,d)}};
const mhash=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return (h>>>0).toString(36)};
const _ch={};
function chunksOf(s){
  const sr=msrc(s);if(!sr)return[];const key=s.src+':'+sr.text.length+':'+mhash(sr.text.slice(0,200));if(_ch[key])return _ch[key];
  const out=[];
  if(sr.isMd){
    let buf=[],n=0;const flush=()=>{if(buf.length){const t=buf.join('\n');if(/^[\s\-*_=|:]*$/.test(t)){buf=[];return}out.push({id:'k'+n+'_'+mhash(t),text:t,h:/^#{1,6}\s/.test(t)&&buf.length===1,page:null});n++;buf=[]}};
    sr.text.split('\n').forEach(l=>{if(!l.trim()){flush();return}if(/^#{1,6}\s/.test(l)){flush();buf=[l];flush();return}buf.push(l);if(buf.join('\n').length>700&&!/^\s*\|/.test(l))flush()});flush();
  }else{
    let page=null,n=0;sr.text.split(/\[Página (\d+)\]/).forEach((seg,i)=>{if(i%2===1){page=+seg;return}
      const sents=seg.replace(/\s+/g,' ').trim().split(/(?<=[.!?;:])\s+(?=[A-ZÁÉÍÓÚÂÊÔÃÕÇ0-9"(])/);let cur='';
      const push=()=>{const t=cur.trim();if(t){out.push({id:'p'+page+'_'+n+'_'+mhash(t),text:t,h:false,page});n++}cur=''};
      sents.forEach(x=>{cur+=(cur?' ':'')+x;if(cur.length>450)push()});push()});
  }
  _ch[key]=out;return out;
}
function outlineOf(s){
  const sr=msrc(s);if(!sr)return{tree:[],stats:{}};
  if(sr.isJob){const tree=headsVis(s).map(h=>({l:h.l,t:h.t}));if(tree.length)return{tree,stats:{},ai:false}}
  if(!sr.isMd)return{tree:(s.scan&&s.scan.outline)||[],stats:{},ai:true};
  const t=sr.text,tree=[];t.split('\n').forEach(l=>{const m=l.match(/^(#{1,6})\s+(.*)/);if(m)tree.push({l:m[1].length,t:m[2].replace(/[*_`]/g,'').trim()})});
  const stats={tabelas:(t.match(/^\|.*\|\s*$/gm)||[]).filter((x,i,a)=>/^\|[\s:|-]+\|$/.test(x)).length,imagens:(t.match(/!\[[^\]]*\]\(/g)||[]).length,diagramas:(t.match(/```(mermaid|dot)/g)||[]).length,destaques:(t.match(/==[^=\n]+==/g)||[]).length,quadros:(t.match(/^>\s*\[!/gm)||[]).length};
  return{tree,stats};
}
function seedChunk(chs,seed){
  const words=[...new Set(norm(seed).split(/[^a-z0-9]+/).filter(w=>w.length>=5))];if(!words.length)return null;
  let best=null,bs=0;chs.forEach(c=>{if(c.h)return;const t=norm(c.text);let sc=0;words.forEach(w=>{if(t.includes(w))sc++});sc=sc/Math.sqrt(Math.max(t.length,80)/80);if(sc>bs){bs=sc;best=c}});
  return bs>=1.2?best:null;
}

/* ---------- IA ---------- */
async function mai(prompt,json){
  const ai=await ensureAI();if(!ai){toast('A IA não está disponível nesta visualização');return null}
  let tm;
  try{
    const run=json?ai.json(prompt,{cache:false}):ai(prompt,{cache:false}).then(r=>r.text);
    const lim=new Promise((_,rej)=>{tm=setTimeout(()=>rej({code:'timeout'}),json?120000:150000)});
    return await Promise.race([run,lim]);
  }
  catch(e){V.aierr=e&&e.code||'erro';toast(e&&e.code==='not_granted'?'Você não autorizou a IA':e&&e.code==='rate_limited'?'Muitas solicitações, aguarde':e&&e.code==='timeout'?'A IA demorou demais. Tente de novo.':'Falha da IA: '+(e&&e.message||'erro'));return null}
  finally{clearTimeout(tm)}
}

  const body=!sr?`<div class="card">${empty('Conteúdo de origem não encontrado','O resumo ou material desta sessão foi excluído.')}</div>`:[stepInc,stepRead][st-1](s,sr);
  return head(esc(clip(s.title||'Sessão',60)),`<button class="btn sm" data-act="mgoq" data-sid="${s.id}">Questões</button><button class="btn sm" data-act="mdelses" aria-label="Excluir sessão">✕</button><button class="btn sm" data-act="mclosereq">Encerrar</button>`)+
  `<div class="tiny muted">${esc((get('subjects',s.subjectId)||{}).name||'')} · tempo ativo ${fmtT((s.secs||0)+_acc)} · salvo automaticamente</div>${stepper}
  <div style="margin:18px 2px 10px"><div class="tiny muted" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">Etapa ${st} de ${STEPS.length}</div><h2 style="margin-top:4px;font-size:20px">${STEPS[st-1][0]}</h2></div>${body}
  <div class="row sec" style="gap:8px"><button class="btn" data-act="mstep" data-n="${Math.max(1,st-1)}" ${st===1?'disabled':''}>← Voltar</button><span class="grow"></span><button class="btn pri" data-act="mdone">${st===STEPS.length?'Concluir etapa':'Concluir e avançar →'}</button></div>`;
}

/* ---------- ETAPA 1 (chat) ---------- */
const CHAT_MAX=40;
function chatBubble(m,i,s){
  if(m.role==='user')return `<div style="display:flex;justify-content:flex-end;margin:8px 0"><div style="max-width:92%;background:var(--accent-soft);border-radius:14px 14px 4px 14px;padding:9px 12px;font-size:14px;white-space:pre-wrap;word-break:break-word">${esc(clip(m.text,1200))}</div></div>`;
  return `<div style="margin:8px 0"><div class="card" style="padding:10px 12px;border-radius:14px 14px 14px 4px"><div class="md" style="font-size:15px;line-height:1.55">${md(m.text)}</div><div class="row" style="margin-top:8px"><button class="btn sm" data-act="mchatsave" data-i="${i}">Salvar em “Meu entendimento”</button></div></div></div>`;
}
function step1(s,sr){
  const cs=s.concepts||[],chat=s.chat||[];
  return `<div class="card"><div class="tiny muted">Leia o PDF/material fora do app. Quando algo não ficar claro, <b>copie o trecho, cole aqui</b> e eu explico em linguagem simples, mantendo o termo técnico.</div></div>
  <div class="sec" style="margin-top:8px"><div id="mchat" style="min-height:60px">${chat.length?chat.map((m,i)=>chatBubble(m,i,s)).join(''):'<div class="muted tiny" style="padding:10px 2px">Nenhuma pergunta ainda. Cole um trecho abaixo.</div>'}${V.mpend===s.id?'<div class="card" style="margin:8px 0;padding:10px 12px"><span class="muted">O professor está explicando… (pode levar até 1 minuto)</span></div>':''}${V.merr&&V.merr.sid===s.id?`<div class="card" style="margin:8px 0;padding:10px 12px;border-left:4px solid var(--bad)"><b>Não consegui explicar agora.</b><div class="tiny muted" style="margin:4px 0 8px">${V.aierr==='not_granted'?'Autorize o uso da IA quando o app pedir.':V.aierr==='timeout'?'A IA demorou demais.':'A IA não respondeu.'} Sua pergunta continua salva acima.</div><button class="btn sm pri" data-act="mchatretry">↻ Tentar de novo</button></div>`:''}<div id="mchatend"></div></div>
  <div class="card" style="margin-top:8px;padding:10px"><textarea data-mic id="mchatin" rows="4" placeholder="Cole aqui o trecho do PDF (ou digite uma dúvida)"></textarea>
  <button class="btn pri" data-act="mchatsend" style="width:100%;margin-top:8px">Explicar para leigos</button><div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn" data-act="mbasics">Conceitos básicos</button>${chat.length?'<button class="btn sm" data-act="mchatclr" aria-label="Limpar conversa">Limpar</button>':''}</div></div></div>
  ${s.basics&&s.basics.length?`<div class="sec"><h2>Conceitos básicos para entender esta aula</h2><div class="card">${s.basics.map(x=>`<div style="margin-bottom:8px"><b>${esc(x.termo||'')}</b><div class="tiny muted">${esc(x.simples||'')}</div></div>`).join('')}</div></div>`:''}
  <div class="sec"><h2>Meu entendimento dos conceitos (${cs.length})</h2>${cs.length?`<div class="list">${cs.map(c=>`<div class="item" style="display:block"><div class="row"><b class="grow">${esc(c.term)}</b><button class="btn sm" data-act="mdelconc" data-id="${c.id}" aria-label="Excluir">✕</button></div>${c.md?`<div class="md tiny" style="margin-top:4px">${md(c.md)}</div>`:`<div class="tiny" style="margin-top:4px">${esc(c.simple)}</div><div class="tiny muted" style="margin-top:4px">${esc(clip(c.concept,220))}</div>`}${c.excerpt?`<div class="row" style="margin-top:6px;gap:6px"><button class="btn sm" data-act="opensrc" data-src="${esc(s.src||'')}" data-anchor="" data-q="${esc(clip(c.excerpt,80))}">Ir ao trecho</button></div>`:''}</div>`).join('')}</div>`:'<span class="muted">As explicações que você salvar ficam aqui.</span>'}</div>`;
}
const chatEnd=()=>setTimeout(()=>{const e=$('#mchatend');if(e&&e.scrollIntoView)e.scrollIntoView({block:'end',behavior:'smooth'})},150);
async function chatAsk(t,again){
  const s0=mget(V.p.sid);if(!s0)return;
  if(_busy){toast('Aguarde a ação atual');return}
  _busy=true;V.merr=null;V.mpend=s0.id;
  try{
    const sr=msrc(s0);let chat=(s0.chat||[]);
    if(!again){chat=chat.concat({role:'user',text:t.slice(0,4000),at:Date.now()});await mpatch(s0.id,{chat:chat.slice(-CHAT_MAX)})}
    render();chatEnd();
    const hist=chat.slice(-7,-1).map(m=>(m.role==='user'?'ALUNO: ':'PROFESSOR: ')+clip(m.text,600)).join('\n');
    const r=await mai(`Você é um professor que traduz conteúdo técnico para leigos, em conversa com um aluno de concurso (concurso público). ${BASE_RULES}\nDisciplina: ${(get('subjects',s0.subjectId)||{}).name||'—'}. Documento: "${sr?sr.title:''}".\n${hist?'Conversa recente:\n'+hist+'\n\n':''}Mensagem atual do aluno (trecho colado ou dúvida):\n"""${t.slice(0,4000)}"""\n\nResponda em Markdown CURTO, sem introdução e sem despedida. Se for um trecho, comece com **Ideia central:** (1 frase). Depois, para os até 4 termos técnicos mais importantes, use este formato:\n**Termo técnico original**\n- Simples: ...\n- Conceito: ... (1-2 frases)\n- Exemplo: ... (curto)\n- Relação: ... (só se agregar)\nSe for uma dúvida, responda direto em até 6 linhas. Mantenha os termos técnicos originais.`,false);
    if(r&&String(r).trim()){const c2=(mget(s0.id).chat||[]).concat({role:'ai',text:r,at:Date.now()});await mpatch(s0.id,{chat:c2.slice(-CHAT_MAX)})}
    else V.merr={sid:s0.id,text:t};
  }finally{_busy=false;V.mpend=null;render();chatEnd()}
}
ACT.mchatsend=()=>{const inp=$('#mchatin'),t=inp&&inp.value.trim();if(!t){toast('Cole um trecho ou digite uma dúvida');return}
  if(inp){inp.value='';inp.blur()}
  return chatAsk(t,false);
};
ACT.mchatretry=()=>{const e=V.merr;if(!e)return;return chatAsk(e.text,true)};

}

/* ---------- NOVA ETAPA 1: Como cai na prova (mapa de incidência) ---------- */
const incPool=s=>{let p=s.topicId?S.questions.filter(q=>q.topicId===s.topicId):[];if(!p.length&&s.subjectId)p=S.questions.filter(q=>q.subjectId===s.subjectId);return p};
const PESO={3:['ALTA','Cai muito'],2:['MÉDIA','Cai às vezes'],1:['BAIXA','Cai pouco']};
const pesoTag=w=>{const c={3:['ALTA','#ef4444'],2:['MÉDIA','#f59e0b'],1:['BAIXA','#9a9a94']}[w]||['BAIXA','#9a9a94'];return `<span style="display:inline-block;font-size:10px;font-weight:800;letter-spacing:.07em;padding:2px 7px;border-radius:6px;color:${c[1]};border:1.5px solid ${c[1]};line-height:1.3;vertical-align:middle">${c[0]}</span>`};
const fixCut=(x,m)=>{x=String(x||'');if(x.length<m-2)return x;let t=x.replace(/\s+\S*$/,'').replace(/\([^)]*$/,'').replace(/[\s,;:·-]+$/,'');return t+'…'};
function stepInc(s,sr){
  const pool=incPool(s),inc=s.inc,busy=V.minc===s.id;
  const cov={};pool.forEach(q=>{const k=String(q.covt||'').trim()||'Sem classificação';cov[k]=(cov[k]||0)+1});
  const ks=Object.entries(cov).sort((a,b)=>b[1]-a[1]),mx=ks.length?ks[0][1]:1;
  const nC=pool.filter(q=>String(q.gab||'').toUpperCase()==='C').length,nE=pool.filter(q=>String(q.gab||'').toUpperCase()==='E').length;
  const bancas={};pool.forEach(q=>{const b=String(q.banca||'').split('·')[0].trim();if(b&&!/^inédita/i.test(b))bancas[b]=(bancas[b]||0)+1});
  const bt=Object.entries(bancas).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([b,n])=>b+' ('+n+')').join(' · ');
  let html=`<div class="card"><div class="tiny muted">Objetivo: saber <b>onde bater o olho</b> antes de abrir o PDF. O app olha as questões deste assunto e mostra o que mais cai e como a banca cobra.</div></div>${passoBlock(s)}`;
  html+=`<div class="sec"><h2>O que mais cai (${pool.length} questão${pool.length!==1?'ões':''})</h2>`;
  if(!pool.length)html+=`<div class="card"><span class="muted">Nenhuma questão deste assunto no banco. Importe as questões do PDF primeiro, ou use o botão abaixo para a IA analisar a bateria que está no final do material.</span></div>`;
  else html+=`<div class="card">${ks.slice(0,12).map(([k,n])=>`<div style="margin:8px 0"><div class="row"><span class="grow">${pesoTag(n>=mx*.66?3:n>=mx*.33?2:1)} ${esc(k)}</span><b>${n}</b></div><div class="bar" style="margin-top:3px"><i style="width:${Math.round(n/mx*100)}%"></i></div></div>`).join('')}${(nC+nE)?`<div class="tiny muted" style="margin-top:8px">Certo/Errado: ${nC} certas · ${nE} erradas${bt?' · bancas: '+esc(bt):''}</div>`:''}</div>`;
  html+=`</div><div class="sec"><h2>Como a banca cobra</h2>`;
  if(busy)html+=`<div class="card"><span class="muted">Analisando as questões… (pode levar até 1 minuto)</span></div>`;
  else if(!inc||!(inc.pontos||[]).length)html+=`<div class="card"><div class="tiny muted" style="margin-bottom:8px">A IA lê as questões e os comentários e devolve, por ponto: peso, jeito de cobrar, pegadinhas e onde olhar no material.</div><button class="btn pri" data-act="minc" style="width:100%">Mapear como cai</button></div>`;
  else html+=`${inc.resumo?`<div class="card" style="margin-bottom:8px">${esc(inc.resumo)}</div>`:''}<div class="list">${(inc.pontos||[]).slice().sort((a,b)=>(b.peso||0)-(a.peso||0)).map(p=>`<div class="item" style="display:block"><div class="row"><b class="grow">${pesoTag(p.peso)} ${esc(fixCut(p.ponto,120))}</b><span class="chip">${(PESO[p.peso]||PESO[1])[1]}</span></div>${p.como_cobra?`<div class="tiny" style="margin-top:4px">Como cobra: ${esc(fixCut(p.como_cobra,260))}</div>`:''}${(p.pegadinhas||[]).length?`<div class="tiny" style="margin-top:4px">Pegadinha: ${(p.pegadinhas||[]).map(x=>esc(fixCut(x,120))).join(' · ')}</div>`:''}${(p.palavras||[]).length?`<div class="tiny muted" style="margin-top:4px">Palavras-chave: ${(p.palavras||[]).map(esc).join(' · ')}</div>`:''}${p.onde?`<div class="tiny muted" style="margin-top:4px">Onde olhar: ${esc(fixCut(p.onde,140))}</div>`:''}</div>`).join('')}</div><div class="row" style="margin-top:8px"><button class="btn sm" data-act="minc">Mapear de novo</button></div>`;
  return html+'</div>';
}
ACT.minc=()=>{const s=mget(V.p.sid);if(!s)return;withBusy('Mapeando como cai',async()=>{
  V.minc=s.id;render();try{
    const sr=msrc(s),pool=incPool(s),subj=(get('subjects',s.subjectId)||{}).name||'estudo';
    const heads=(sr?outlineOf(s).tree.map(x=>x.t):[]).slice(0,50).join(' | ').slice(0,1500);
    let dig=pool.slice(0,45).map(q=>{const e=q.expl||{};return '['+(q.gab||'?')+'] '+clip(q.statement,230)+(e.macete?' | macete: '+clip(e.macete,90):'')+(q.covt?' | ponto: '+q.covt:'')}).join('\n');
    if(!dig&&sr)dig='(sem banco de questões; use a bateria que aparece no final do material)\n'+sr.text.slice(-12000);
    if(!dig){toast('Sem questões nem material para analisar');return}
    const r=await mai(`${BASE_RULES}\nVocê analisa o padrão de cobrança de bancas (Cebraspe) para o aluno saber ONDE PRESTAR ATENÇÃO ao ler o material. Disciplina: ${subj}. Com base SOMENTE nas questões abaixo, devolva de 6 a 10 pontos do assunto. Para cada um: peso 3 (cai muito), 2 (cai às vezes) ou 1 (cai pouco), segundo a frequência nas questões; como_cobra (1 frase: o tipo de afirmação que a banca faz); pegadinhas (até 3 trocas típicas, cada uma uma frase COMPLETA de no máximo 150 caracteres, nunca cortada no meio nem com parêntese aberto); palavras (até 4 termos-chave para procurar no material); onde (título ou seção do material onde isso está, usando os títulos listados quando possível). Não invente artigo, súmula ou fato que não esteja nas questões ou nos títulos. JSON {"resumo":"1 ou 2 frases sobre o que a banca mais quer","pontos":[{"ponto":"","peso":3,"como_cobra":"","pegadinhas":[""],"palavras":[""],"onde":""}]}. Somente o JSON.\n\nTÍTULOS DO MATERIAL: ${heads||'(sem títulos)'}\n\nQUESTÕES:\n${dig}`,true);
    if(r&&(r.pontos||[]).length)await mpatch(s.id,{inc:{resumo:String(r.resumo||'').slice(0,400),pontos:r.pontos.slice(0,12).map(p=>({ponto:String(p.ponto||'').slice(0,200),peso:[1,2,3].includes(+p.peso)?+p.peso:1,como_cobra:String(p.como_cobra||'').slice(0,360),pegadinhas:(p.pegadinhas||[]).slice(0,3).map(x=>String(x).slice(0,220)),palavras:(p.palavras||[]).slice(0,4).map(x=>String(x).slice(0,80)),onde:String(p.onde||'').slice(0,200)})),n:pool.length,at:Date.now()},seen:{}});
    else if(r)toast('A IA não devolveu pontos. Tente de novo.');
  }finally{V.minc=null;render()}
})};

/* ---------- formatador do texto bruto do Passo ---------- */
function fmtRot(tx){
  const UP='A-ZÁÀÂÃÉÊÍÓÔÕÚÇ',LO='a-záàâãéêíóôõúç';
  const NOISE=/^(Diego Carvalho|Fernando Pedrosa Lopes|Júlio Cardozo|Julio Cardozo|Renato da Costa|Evandro Guedes|Equipe Passo Estratégico|www\.estrategia.*|Passo Estratégico.*|\d{1,3}|[A-Z](\s[A-Z]){2,})$/i;
  let L=String(tx||'').replace(/\r/g,'').split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x&&!NOISE.test(x));
  const M=[];for(let i=0;i<L.length;i++){if(/^[•·▪●\-–]$/.test(L[i])&&L[i+1]){M.push('• '+L[++i])}else M.push(L[i])}
  const isHead=x=>x.length<=70&&x.length>=3&&x===x.toUpperCase()&&/[A-ZÁÀÂÃÉÊÍÓÔÕÚÇ]{3}/.test(x)&&!/[.;]$/.test(x);
  const fixHead=x=>x.replace(new RegExp('\\b(['+UP+']) (?=['+UP+']{2,}\\b)','g'),'$1');
  const B=[];let cur=null;
  const flush=()=>{if(cur){B.push(cur);cur=null}};
  for(let k=0;k<M.length;k++){const ln=M[k],nx=M[k+1]||'';
    if(ln.length<=42&&!/[.:;,!?)]$/.test(ln)&&!/^[•·▪●]/.test(ln)&&!isHead(ln)&&new RegExp('^['+UP+']').test(ln)&&nx&&new RegExp('^['+UP+'•·▪●]').test(nx)&&(!cur||/[.:;!?)]$/.test(cur.x))&&!/^\d/.test(ln)){flush();B.push({t:'s',x:ln});continue}
    if(isHead(ln)){flush();B.push({t:'h',x:fixHead(ln)});continue}
    if(/^[•·▪●]\s*/.test(ln)){flush();cur={t:'li',x:ln.replace(/^[•·▪●]\s*/,'')};continue}
    if(cur&&/[.:;!?)]$/.test(cur.x)&&new RegExp('^([0-9]+[.)]|\\(['+LO+']\\)|Art\\.|['+UP+'])').test(ln)){flush()}
    if(!cur)cur={t:'p',x:ln};else cur.x+=(/[\-]$/.test(cur.x)?'':' ')+ln;
  }
  flush();
  for(let k=0;k<B.length-3;k++){const a=B[k],p1=B[k+1],c=B[k+2],p2=B[k+3];
    if(a.t==='h'&&p1.t==='p'&&c.t==='h'&&c.x.length<=14&&p2.t==='p'&&new RegExp('^['+LO+']').test(p2.x)){B.splice(k,4,{t:'p',x:a.x+' '+c.x+' '+p1.x+' '+p2.x})}}
  const PAL=['var(--accent)','var(--ok)','var(--warn)','#60a5fa','#c084fc','var(--bad)'];
  const tm=x=>{const m=x.match(new RegExp('^(['+UP+'0-9][' +UP+'0-9 …/\\.\\-\\+]{1,38}?)\\s+(['+UP+']['+LO+'].+)$'));return m&&m[1].trim().length>=2&&m[1]===m[1].toUpperCase()?[m[1].trim(),m[2]]:null};
  const hl=x=>esc(x).replace(/\b([A-ZÁÀÂÃÉÊÍÓÔÕÚÇ]{3,})\b/g,'<em class="rk">$1</em>').replace(/(\d+(?:[.,]\d+)?\s?%)/g,'<em class="rn">$1</em>');
  const ALERT=/pegadinha|atenção|cuidado|cebraspe|cespe|banca|cobra|cai em prova|macete|importante|exceção|exceções/i;
  let h='',inUl=false,ci=-1,col=PAL[0],i=0;
  while(i<B.length){
    const b=B[i];
    if(b.t!=='li'&&inUl){h+='</ul>';inUl=false}
    if(b.t==='h'){ci++;col=PAL[ci%PAL.length];h+='<div class="rh" style="--sc:'+col+'">'+esc(b.x)+'</div>';i++;continue}
    if(b.t==='s'){h+='<div class="rs" style="--sc:'+col+'">'+esc(b.x)+'</div>';i++;continue}
    if(b.t==='li'){if(!inUl){h+='<ul style="--sc:'+col+'">';inUl=true}h+='<li>'+hl(b.x)+'</li>';i++;continue}
    const t0=tm(b.x);
    if(t0){let rows=[];while(i<B.length&&B[i].t==='p'&&tm(B[i].x)){rows.push(tm(B[i].x));i++}
      if(rows.length>=2){h+='<div class="rtw"><table class="rtb" style="--sc:'+col+'"><thead><tr><th>Termo</th><th>O que é / como cai</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+hl(r[1])+'</td></tr>').join('')+'</tbody></table></div>'}
      else h+='<p><b style="color:'+col+'">'+esc(rows[0][0])+'</b> — '+hl(rows[0][1])+'</p>';
      continue}
    h+=ALERT.test(b.x)?'<div class="rcl">'+hl(b.x)+'</div>':'<p>'+hl(b.x)+'</p>';i++;
  }
  if(inUl)h+='</ul>';
  return h||'<span class="muted">Sem texto.</span>'}

const ORIG={banco:'Banco de questões',pdf:'Do material',ia:'Gerada por IA — não é questão oficial'};

/* validação: descarta questões incompletas */
function qOk(q){
  const t=String(q.text||'').trim();if(t.length<45)return false;
  if(!/[.?!;:)”"']$/.test(t))return false;
  if(/(conforme (o )?texto|segundo (o )?texto|texto acima|trecho acima|a seguir|abaixo|\.\.\.|…)\s*[.?]?$/i.test(t)&&t.length<80)return false;
  if(/\b(conforme o texto|de acordo com o texto|segundo o texto|no trecho|no texto acima)\b/i.test(t))return false;
  const o=(q.opts||[]).filter(x=>String(x).trim().length>1);
  if(q.opts&&q.opts.length){if(o.length<4||o.length!==q.opts.length)return false;if(!/^[A-E]$/i.test(String(q.key||'').trim()[0]||''))return false;if('ABCDE'.indexOf(String(q.key).trim().toUpperCase()[0])>=o.length)return false}
  else{if(!/^(C|E|CERTO|ERRADO)$/i.test(String(q.key||'').trim()))return false}
  return true;
}
const qNorm=t=>norm(String(t||'')).replace(/[^a-z0-9]+/g,' ').trim();
function qDedupe(a){const seen=[];return a.filter(q=>{const k=qNorm(q.text).slice(0,70);if(seen.some(x=>x===k||(k.length>30&&(x.startsWith(k.slice(0,40))))))return false;seen.push(k);return true})}
/* amostra espalhada do material + títulos, para diversificar */
function spreadSample(s,max){
  const sr=msrc(s),t=sr.text||'';if(t.length<=max)return t;
  const heads=outlineOf(s).tree.map(x=>x.t).slice(0,50);const nseg=5,per=Math.floor((max-(heads.length?1200:0))/nseg),seg=[];
  for(let i=0;i<nseg;i++){const st=Math.floor((t.length-per)*i/(nseg-1));seg.push(t.slice(st,st+per))}
  return (heads.length?'TÍTULOS DAS SEÇÕES: '+heads.join(' | ').slice(0,1200)+'\n\n':'')+seg.join('\n[...]\n');
}
async function genQs(s,k,n){
  const sr=msrc(s),subj=(get('subjects',s.subjectId)||{}).name||'estudo';let out=[];
  for(let tryN=0;tryN<2&&out.length<n;tryN++){
    const need=n-out.length,ask=need+4,avoid=out.length?`\nNÃO repita estes assuntos já cobertos:\n${out.map(q=>'- '+clip(q.text,90)).join('\n')}\n`:'';
    let prompt;
    if(k==='pdf'){
      prompt=`${BASE_RULES}\nO texto abaixo é o final de um material. Localize a bateria de questões que JÁ EXISTE nele e copie até ${ask} questões COMPLETAS, sem alterar o enunciado. Ignore enunciados cortados ou sem gabarito. Se não houver questões, devolva lista vazia. JSON {"questoes":[{"enunciado":"...","alternativas":[],"gabarito":"C|E|letra"}]} (alternativas vazias para certo/errado). Somente o JSON.\n\n${sr.text.slice(-16000)}`;
    }else{
      prompt=`${BASE_RULES}\nVocê é elaborador de questões da banca Cebraspe (CESPE). Crie ${ask} itens de ${subj} no estilo CERTO/ERRADO, baseados EXCLUSIVAMENTE no material.\nRegras de qualidade:\n- Cada item é uma afirmação COMPLETA e AUTOSSUFICIENTE, de 1 a 3 frases (mínimo 12 palavras), terminando com ponto final.\n- Nunca use "conforme o texto", "segundo o texto", "acima", "a seguir": o item deve fazer sentido sozinho.\n- Metade dos itens CERTOS e metade ERRADOS. Os errados devem trocar um detalhe técnico plausível (prazo, sujeito, condição, exceção, "sempre/nunca"), sem pegadinha de português.\n- Cubra seções DIFERENTES do material (use os títulos), sem repetir assunto.\n- Mantenha os termos técnicos originais.${avoid}\nJSON {"questoes":[{"enunciado":"afirmação completa","alternativas":[],"gabarito":"C"}]} com gabarito C ou E. Somente o JSON.\n\nMaterial:\n${spreadSample(s,11000)}`;
    }
    const r=await mai(prompt,true);if(!r)return out.length?out:null;
    const got=(r.questoes||[]).map((q,i)=>({id:'q'+uid()+tryN+i,origin:k,text:String(q.enunciado||'').trim(),opts:(q.alternativas||[]).map(x=>String(x).replace(/^\s*[A-Ea-e][).]\s*/,'').trim()),key:q.gabarito})).filter(qOk);
    out=qDedupe(out.concat(got));
    if(k==='pdf'&&!got.length)break;
  }
  if(k!=='pdf'){ // equilibra certo/errado quando possível
    const c=out.filter(q=>!q.opts.length&&keyOf(q)==='Certo'),e=out.filter(q=>!q.opts.length&&keyOf(q)==='Errado'),m=out.filter(q=>q.opts.length);
    if(m.length===0&&c.length&&e.length){const h=Math.ceil(n/2),pick=[];let i=0;const A=c.slice(),B=e.slice();while(pick.length<n&&(A.length||B.length)){const x=(i++%2?B:A).shift()||(A.length?A.shift():B.shift());if(x)pick.push(x)}out=pick}
  }
  return out.slice(0,n);
}

    if(!pool.length){toast('Seu banco não tem questões desta disciplina. Use outra origem.');return}
    qs=pool.sort(()=>Math.random()-.5).map(q=>({id:'q'+q.id,qid:q.id,origin:'banco',text:String(q.statement||'').trim(),opts:(q.alts||'').split('\n').map(x=>x.replace(/^\s*[A-Ea-e][).]\s*/,'').trim()).filter(Boolean),key:q.gab})).filter(q=>q.text.length>=20&&q.key).slice(0,n);
    if(!qs.length){toast('As questões do seu banco estão sem enunciado ou gabarito. Use outra origem.');return}}
  else{qs=await genQs(s,k,n);if(!qs)return;

  await mpatch(s.id,{pre:{qs,r1:{},r2:{},seeds:[]}});
});

/* ---------- ETAPA 4 (somente títulos e subtítulos) ---------- */
const _hd={};
const HSKIP=/^(legenda|t[óo]picos cobertos|resumo gerado)/i;
function headsRaw(s){
  const sr=msrc(s);if(!sr)return[];const key=s.src+':'+sr.text.length+':'+mhash(sr.text.slice(0,200))+':'+((s.scan&&s.scan.outline)||[]).length;if(_hd[key])return _hd[key];
  const out=[];
  if(sr.isJob&&/^#{1,4}\s/m.test(sr.text)){
    const lines=sr.text.split('\n');let page=null;const hs=[];
    lines.forEach((l,i)=>{const pm=l.match(/^\[Página (\d+)\]\s*$/);if(pm){page=+pm[1];return}const m=l.match(/^(#{1,4})\s+(.+)/);if(m)hs.push({i,l:m[1].length,t:m[2].trim(),page})});
    hs.forEach((h,k)=>{const nx=hs[k+1],en=hs.slice(k+1).find(x=>x.l<=h.l),full=lines.slice(h.i+1,en?en.i:lines.length).filter(x=>!/^#{1,4}\s/.test(x)).join('\n'),ctx=lines.slice(h.i+1,en?en.i:lines.length).filter(x=>!/^\[Página \d+\]\s*$/.test(x)).join(' ').replace(/\s+/g,' ').trim().slice(0,1500);
      out.push({id:'h'+k+'_'+mhash(h.t),t:h.t,l:h.l,page:h.page,pageTo:nx&&nx.page>h.page?nx.page:null,ctx,full,hasBody:ctx.length>40})});
    _hd[key]=out;return out;
  }
  if(sr.isMd){
    const lines=sr.text.split('\n'),hs=[];
    lines.forEach((l,i)=>{const m=l.match(/^(#{1,6})\s+(.*)/);if(m)hs.push({i,l:m[1].length,t:m[2].replace(/[*_`#]/g,'').replace(/^[\p{Extended_Pictographic}️\s]+/u,'').trim(),raw:m[2].trim()})});
    const marks=[];lines.forEach((l,i)=>{const m=l.match(/^\*\(págs?\.\s*(\d+)(?:\s*[–-]\s*(\d+))?\)\*\s*$/);if(m)marks.push({i,a:+m[1],b:+(m[2]||m[1])})});
    hs.forEach((h,k)=>{
      if(!h.t||HSKIP.test(h.t)||/^volume \d/i.test(h.t))return;
      if(h.l===1&&k===0)return;
      let end=lines.length;for(let j=k+1;j<hs.length;j++){if(hs[j].l<=h.l){end=hs[j].i;break}}
      const nxt=k+1<hs.length?hs[k+1].i:lines.length;
      const full=lines.slice(h.i+1,end).filter(x=>!/^#{1,6}\s/.test(x)&&!/^\*\(págs?\./.test(x)&&!/^---+$/.test(x.trim())).join('\n');
      const ctx=lines.slice(h.i+1,Math.min(end,h.i+1+60)).filter(x=>!/^\*\(págs?\./.test(x)&&!/^---+$/.test(x.trim())).join('\n').trim().slice(0,1500);
      const mk=marks.find(m=>m.i>h.i);
      out.push({id:'h'+k+'_'+mhash(h.t),t:h.t,l:h.l,page:mk?mk.a:null,pageTo:mk?mk.b:null,ctx,full,hasBody:ctx.length>40});
    });
  }else{
    const low=sr.text.toLowerCase();
    (((s.scan||{}).outline)||[]).forEach((o,k)=>{const t=String(o.t||'').trim();if(!t)return;
      const ix=low.indexOf(t.toLowerCase().slice(0,40));const ctx=ix>=0?sr.text.slice(ix+t.length,ix+t.length+1500).replace(/\[Página \d+\]/g,'').replace(/\s+/g,' ').trim():'';
      const pm=ix>=0?sr.text.slice(0,ix).match(/\[Página (\d+)\](?![\s\S]*\[Página \d+\])/):null;
      out.push({id:'h'+k+'_'+mhash(t),t,l:Math.max(1,Math.min(6,+o.l||1)),page:pm?+pm[1]:null,pageTo:null,ctx,hasBody:ctx.length>40})});
  }
  _hd[key]=out;return out;
}
/* ---------- limpeza dos títulos: remove índice, apresentação, questões, repetidos ---------- */
const NOISE=[
  ['índice',/^(indice|sumario|conteudo programatico|conteudo da aula)\b/],

/* ---------- extração completa (sem corte) ---------- */
async function extractPdfPages(file,onProg){
  await loadLib('pdf');const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;const raw=[];
  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i),c=await pg.getTextContent();let last=null,cur=null;const lines=[];
    c.items.forEach(x=>{if(x.str==null)return;const y=x.transform?Math.round(x.transform[5]):0,h=x.transform?Math.abs(x.transform[3])||x.height||0:0;
      if(cur===null||(last!==null&&Math.abs(y-last)>3)){cur={t:'',h:0,y};lines.push(cur)}
      cur.t+=(cur.t&&!/\s$/.test(cur.t)&&!/^\s/.test(x.str)?' ':'')+x.str;if(x.str.trim())cur.h=Math.max(cur.h,h);last=y});
    raw.push({n:i,lines:lines.map(l=>({t:l.t.replace(/[ \t]+/g,' ').trim(),h:Math.round(l.h*2)/2,y:l.y})).filter(l=>l.t)});
    if(onProg&&i%5===0)onProg(i,pdf.numPages);
  }
  return structurePages(raw);
}
/* reconhece títulos pelo tamanho da fonte e remove cabeçalhos/rodapés repetidos */
function structurePages(raw){
  const N=raw.length,norm0=t=>t.replace(/\d+/g,'#').toLowerCase(),cnt={};
  raw.forEach(p=>{new Set(p.lines.map(l=>norm0(l.t))).forEach(k=>{cnt[k]=(cnt[k]||0)+1})});
  const rep=Math.max(4,Math.ceil(N*0.4));
  raw.forEach(p=>{p.lines=p.lines.filter(l=>!(l.t.length<=90&&cnt[norm0(l.t)]>=rep)&&!/^(página\s*)?\d{1,4}(\s*(de|\/)\s*\d{1,4})?$/i.test(l.t))});
  const hist={};let tot=0;raw.forEach(p=>p.lines.forEach(l=>{hist[l.h]=(hist[l.h]||0)+l.t.length;tot+=l.t.length}));
  let body=0,bw=-1;for(const k in hist)if(hist[k]>bw){bw=hist[k];body=+k}
  const isH=l=>body>0&&l.h>=body*1.12&&l.h>=body+1&&l.t.length<=140&&/[A-Za-zÀ-ú]/.test(l.t);
  let hl=0,hc=0;raw.forEach(p=>p.lines.forEach(l=>{if(isH(l)){hl++;hc+=l.t.length}}));
  let mode='size';if(!hl||hc>tot*0.2)mode='caps';
  const caps=l=>{const L=l.t.replace(/[^A-Za-zÀ-ú]/g,'');return L.length>=6&&l.t.length<=90&&l.t===l.t.toUpperCase()&&!/[.;]$/.test(l.t)};
  const sizes=mode==='size'?[...new Set(raw.flatMap(p=>p.lines.filter(isH).map(l=>l.h)))].sort((a,b)=>b-a):[];
  const lvl=l=>mode==='size'?Math.min(4,sizes.indexOf(l.h)+1):2;
  const pages=raw.map(p=>{
    const out=[];let prevH=null;
    p.lines.forEach(l=>{const h=mode==='size'?isH(l):caps(l);
      if(h){const lv=lvl(l);if(prevH&&prevH.lv===lv&&prevH.y-l.y<(l.h||12)*1.5&&prevH.y>=l.y){out[prevH.idx]+=' '+l.t;prevH.y=l.y}else{out.push('');out.push('#'.repeat(lv)+' '+l.t);prevH={lv,y:l.y,idx:out.length-1}}}
      else{out.push(l.t);prevH=null}});
    return{n:p.n,text:out.join('\n').replace(/\n{3,}/g,'\n\n').trim(),heads:out.filter(x=>/^#{1,4} /.test(x)).length}});
  pages.mode=mode;return pages;
}
function splitParts(pages,target){
  const parts=[];let cur=null;
  pages.forEach(p=>{
    if(!p.text)return;
    if(!cur)cur={from:p.n,to:p.n,text:''};
    if(cur.text.length>0&&cur.text.length+p.text.length>target){parts.push(cur);cur={from:p.n,to:p.n,text:''}}
    cur.text+=(cur.text?'\n\n':'')+'[Página '+p.n+']\n'+p.text;cur.to=p.n;
  });
  if(cur&&cur.text)parts.push(cur);return parts;
}
