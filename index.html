async function fqRun(sid){
  if(_fq)return;_fq=sid;_fqStop=false;const bg=bgAdd('Fila de PDFs');render();let n=0;
  try{
    for(let guard=0;guard<10&&!_fqStop;guard++){
      const ids=fqIds(sid);if(!ids.length)break;const id=ids[0];
      for(let w=0;w<240&&(_run||_qrun);w++)await new Promise(r=>setTimeout(r,500));
      let j=get('method',id);
      if(j&&!(j.qimp&&j.summaryId)){
        if(!j.topicId&&j.subjectId){const t=await ensureTopic(j.subjectId,j.title);if(t)await patch('method',j.id,{topicId:t})}
        toast('Fila: processando “'+clip(j.title,40)+'”…');
        await autoPipeline(id);n++;
      }
      await fqSet(sid,fqIds(sid).filter(x=>x!==id));
    }
  }catch(e){console.error(e);toast('A fila parou: '+((e&&e.message)||e))}
  finally{_fq='';bgDone(bg);render()}
  if(n)toast('Fila concluída: '+n+' PDF'+(n!==1?'s':'')+' processado'+(n!==1?'s':'')+' ✅')}
function fqBlock(sid){const ids=fqIds(sid);if(!ids.length&&_fq!==sid)return '';
  const run=_fq===sid;
  return `<div class="card" style="padding:10px;margin:0 0 10px"><div class="row" style="gap:6px;align-items:center"><b class="grow">⏳ Fila (${ids.length}/${FQMAX})</b>${run?(_fqStop?'<span class="tiny muted">parando…</span>':'<button class="btn sm" data-act="pjfilastop">⏹ Parar</button>'):(ids.length?`<button class="btn pri sm" data-act="pjfilago" data-sub="${sid}">▶ Iniciar</button>`:'')}</div>
  <div class="list" style="margin-top:6px">${ids.map((id,i)=>{const j=get('method',id);return `<div class="tiny" style="padding:3px 0">${i===0&&run?'🔄':(i+1)+'.'} ${esc(clip(j.title,60))}${i===0&&run?' <span class="muted">— em andamento</span>':''}</div>`}).join('')}</div></div>`}
/* trechos da biblioteca mais parecidos com um texto (para a IA usar como fonte) */
function libSnips(subjectId,text,max){
  max=max||3000;const tk=[...new Set(mmTokens(text))];if(!tk.length)return '';
  const js=jobs().filter(j=>!subjectId||!j.subjectId||j.subjectId===subjectId);if(!js.length)return '';
  const best=[];
  js.forEach(j=>{for(let i=0;i<j.parts.length;i++){const t=jTxt(j.id,i);if(!t)continue;
    (()=>{const ch=[];let cur='';t.split('\n').forEach(l=>{if(cur.length+l.length>800&&cur){ch.push(cur);cur=''}cur+=(cur?'\n':'')+l});if(cur)ch.push(cur);return ch})().forEach(p=>{if(p.length<60)return;const n=norm(p);let sc=0;tk.forEach(w=>{if(n.includes(w))sc++});if(sc>=Math.min(3,tk.length)&&sc>=2)best.push({sc:sc/Math.sqrt(p.length/200+1),t:p.slice(0,900),j:j.title})})}});
  best.sort((a,b)=>b.sc-a.sc);let out='',n=0;for(const b of best){if(out.length+b.t.length>max||n>=6)break;out+='['+b.j+'] '+b.t+'\n\n';n++}
  return out.trim();
}

/* ---------- importar questões que já existem no PDF para o banco de questões ---------- */
const QCAND=/(julgue|gabarito|assinale a (alternativa|op[çc][ãa]o)|\b(cebraspe|cespe|fcc|fgv|vunesp|quadrix|ibfc|idecan|iades|consulplan|esaf)\b)/i;
let _qrun=null;
const qkey=t=>norm(String(t||'')).replace(/[^a-z0-9]+/g,' ').trim().slice(0,70);
function qFromAi(q){
  const st=String(q.enunciado||'').replace(/\s+/g,' ').trim();if(st.length<40||(st.length<70&&!/[.?!;:)”"']$/.test(st)))return null;
  const alts=(q.alternativas||[]).map(x=>String(x).replace(/^\s*\(?[A-Ea-e][).]\s*/,'').trim()).filter(Boolean);
  if(alts.length&&alts.length<4)return null;
  let g=String(q.gabarito||'').trim().toUpperCase();
  if(alts.length){g=/^[A-E]/.test(g)&&'ABCDE'.indexOf(g[0])<alts.length?g[0]:''}else g=/^(C|CERTO)$/.test(g)?'C':/^(E|ERRADO)$/.test(g)?'E':'';
  return{statement:st,alts:alts.join('\n'),gab:g,banca:String(q.banca||'').slice(0,40)};
}
async function importQuestions(jid){
  const j=get('method',jid);if(!j||_qrun)return;
  if(j.qpre&&S.questions.some(q=>q.jobId===jid)){const n=S.questions.filter(q=>q.jobId===jid).length;await patch('method',jid,{qimp:{status:'ok',done:1,total:1,added:n,seen:n,at:Date.now()}});return}
  const idx=j.parts.map((p,i)=>i).filter(i=>{const t=jTxt(jid,i);return QCAND.test(t)||(t.match(/^\s*\(?[A-E]\)\s/gm)||[]).length>=3});
  if(!idx.length){await patch('method',jid,{qimp:{status:'ok',done:0,total:0,added:0,at:Date.now()}});toast('Não encontrei questões neste PDF');return}
  _qrun=jid;const st=(o)=>patch('method',jid,{qimp:Object.assign({status:'rodando',done:0,total:idx.length,added:0},o)});
  await st({});let added=0,done=0,err=false,seen=0,rej=0,dup=0;const have=new Set(S.questions.map(q=>qkey(q.statement))),pend=[];
  try{
    for(const i of idx){
      const r=await mai(`${BASE_RULES}\nExtraia as questões de prova que JÁ EXISTEM no trecho abaixo (não crie nem altere nenhuma). Copie enunciado e alternativas LITERALMENTE. Inclua questões Certo/Errado (alternativas: []) e de múltipla escolha (alternativas sem a letra). Informe o gabarito (C, E ou letra A-E) somente se aparecer no trecho; senão deixe "". Ignore questões cortadas ou incompletas. Se não houver questões, devolva lista vazia.\nJSON {"questoes":[{"enunciado":"...","alternativas":[],"gabarito":"","banca":""}]}. Somente o JSON.\n\nTRECHO:\n${jTxt(jid,i).slice(0,11000)}`,true);
      if(!r){err=true;break}
      let rr=r;if(!(rr.questoes||[]).length&&/gabarito/i.test(jTxt(jid,i))){const r2=await mai(`${BASE_RULES}\nO trecho abaixo contém questões de prova numeradas (enunciado, às vezes alternativas, seguido de "Comentários" e "Gabarito"). Extraia TODAS, copiando o enunciado LITERALMENTE (sem os comentários). Gabarito: C (Certo), E (Errado) ou letra A-E.\nJSON {"questoes":[{"enunciado":"...","alternativas":[],"gabarito":"","banca":""}]}. Somente o JSON.\n\nTRECHO:\n${jTxt(jid,i).slice(0,11000)}`,true);if(r2)rr=r2}
      for(const q of (rr.questoes||[])){seen++;const o=qFromAi(q);if(!o){rej++;continue}const k=qkey(o.statement);if(have.has(k)){dup++;continue}have.add(k);
        const id='qp'+uid();await put('questions',id,Object.assign(o,{marked:'',subjectId:j.subjectId||'',topicId:j.topicId||'',concursoId:'',comment:'',why:'',err:'',date:'',src:'pdf',jobId:jid,createdAt:Date.now()}));added++;if(!o.gab)pend.push({id,st:o.statement,alts:o.alts})}
      done++;await st({done,added});
    }
    /* segunda passada: gabaritos listados em outras partes */
    if(!err&&pend.length){
      const gp=j.parts.map((p,i)=>i).filter(i=>/gabarito/i.test(jTxt(jid,i))).slice(-4);
      for(const i of gp){if(!pend.some(x=>!x.fixed))break;const t=jTxt(jid,i),ix=Math.max(0,t.search(/gabarito/i)-200),todo=pend.filter(x=>!x.fixed).slice(0,40);
        const r=await mai(`${BASE_RULES}\nO trecho abaixo contém gabaritos. Para cada questão da lista, informe o gabarito (C, E ou letra A-E) SOMENTE se o trecho trouxer com clareza a resposta daquela questão. Na dúvida, não inclua. JSON {"respostas":[{"i":0,"g":"C"}]}. Somente o JSON.\n\nQUESTÕES:\n${todo.map((x,n)=>n+'. '+clip(x.st,160)).join('\n')}\n\nTRECHO:\n${t.slice(ix,ix+9000)}`,true);
        if(!r)break;
        for(const a of (r.respostas||[])){const x=todo[+a.i];if(!x)continue;const g=String(a.g||'').trim().toUpperCase()[0];const ok=x.alts?('ABCDE'.indexOf(g)>=0&&'ABCDE'.indexOf(g)<x.alts.split('\n').length):(g==='C'||g==='E');if(ok){await patch('questions',x.id,{gab:g});x.fixed=true}}
      }
    }
  }finally{_qrun=null}
  await st({status:err?'erro':'ok',done,added,seen,rej,dup,at:Date.now()});
  try{if(added)await covAssign(jid)}catch(e){console.error(e)}
  toast(err?'Importação interrompida. Toque em “Importar questões” para tentar de novo.':added?added+' questões do PDF foram para o banco de questões'+(j.subjectId?'':' (sem disciplina)')+(dup?' · '+dup+' repetidas ignoradas':''):(seen?'A IA achou '+seen+' questões, mas '+dup+' já existiam e '+rej+' vieram incompletas':'Não encontrei questões completas neste PDF'))
}

/* ---------- cobertura: liga cada questão a um conceito do conteúdo (para resolver na ordem do conteúdo) ---------- */
/* sem sessão do Método (PDF gerado pelo pipeline automático): os conceitos vêm dos títulos do resumo */
function summaryMd(jid){const j=get('method',jid);if(!j||!j.summaryId)return '';let md='';
  for(let v=1;v<=Math.max(1,j.volumes||1);v++){const d=get('summaries',v===1?j.summaryId:j.summaryId+'_v'+v);if(d&&d.md)md+=d.md+'\n\n'}
  return md}
function covFromSummary(jid){
  const md=summaryMd(jid);if(!md)return [];
  const parts=md.split(/^(#{2,3}) +(.+)$/m),out=[];
  for(let i=1;i<parts.length;i+=3){
    const t=String(parts[i+1]||'').replace(/[*_`>]|^\s*[\p{Extended_Pictographic}✅\u{1F3A8}]+\s*/gu,'').trim(),body=parts[i+2]||'';
    if(!t||/legenda|t[óo]picos cobertos|^resumo|fonte:/i.test(t))continue;
    out.push({id:'s'+out.length,t,text:norm(t+' '+body),title:norm(t),len:body.length,raw:body.trim().slice(0,1800)})}
  const withBody=out.filter(c=>c.len>120);
  return (withBody.length>=3?withBody:out).map(c=>({id:c.id,t:c.t,text:c.text,title:c.title,raw:c.raw}))}
function covConcepts(jid){
  const ses=(S.method||[]).filter(x=>/^m_/.test(x.id)&&x.src==='job:'+jid).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
  if(!ses)return covFromSummary(jid);
  let hs=headsOf(ses).filter(h=>!h.hide&&!h.grp);
  const withBody=hs.filter(h=>(h.ctx||'').length>60);if(withBody.length>=3)hs=withBody;
  return hs.map(h=>({id:h.id,t:h.t,text:norm(h.t+' '+(h.ctx||'')),title:norm(h.t),raw:String(h.ctx||'').slice(0,1800)}));
}
async function covAssign(jid){
  const jj=get('method',jid);if(jj&&jj.covManual)return 0; /* agrupamento feito à mão: não sobrescrever */
  const cs=covConcepts(jid);if(!cs.length)return 0;
  const qs=S.questions.filter(q=>q.jobId===jid);let n=0;
  for(const q of qs){
    const ws=[...new Set(norm((q.statement||'')+' '+(q.alts||'')).split(/[^a-z0-9]+/).filter(w=>w.length>=5))];
    let bi=-1,bs=0;
    cs.forEach((c,i)=>{let sc=0;ws.forEach(w=>{if(c.title.includes(w))sc+=3;else if(c.text.includes(w))sc+=1});sc=sc/Math.sqrt(Math.max(c.text.length,300)/300);if(sc>bs){bs=sc;bi=i}});
    const ok=bi>=0&&bs>=1.5,covn=ok?bi:-1,covt=ok?clip(cs[bi].t,60):'';
    if(q.covn!==covn||q.covt!==covt){await patch('questions',q.id,{covn,covt});}
    if(ok)n++;
  }
  V.qsnap={};
  return n;
}

/* ciclo completo: nenhum conceito do resumo fica sem questão; onde falta, cria questão Certo/Errado a partir do próprio conteúdo */
async function covFill(jid){
  const j=get('method',jid);if(!j||j.covManual)return 0;
  const cs=covConcepts(jid);if(!cs.length)return 0;
  const have=new Set(S.questions.filter(q=>q.jobId===jid&&q.covn>=0).map(q=>q.covn));
  const miss=cs.map((c,i)=>({c,i})).filter(x=>!have.has(x.i)&&String(x.c.raw||'').length>=80);
  if(!miss.length)return 0;
  const ref=S.questions.find(q=>q.jobId===jid)||{};let added=0;
  for(let k=0;k<miss.length;k+=4){
    const grp=miss.slice(k,k+4);
    const r=await mai(`${BASE_RULES}\nCrie, para CADA conceito abaixo, 1 questão inédita no estilo CEBRASPE (item Certo/Errado) que teste esse conceito, usando SOMENTE o texto do conceito. Alterne itens certos e errados (os errados com pegadinha típica da banca). Dê o gabarito (C ou E) e um comentário curto que justifique citando o conteúdo.\nJSON {"q":[{"i":0,"enunciado":"...","gabarito":"C","comentario":"..."}]}. Somente o JSON.\n\n${grp.map((x,n)=>'CONCEITO '+n+': '+x.c.t+'\n'+x.c.raw).join('\n\n')}`,true);
    if(!r)continue;
    for(const a of (r.q||[])){const x=grp[+a.i];if(!x)continue;
      const st=String(a.enunciado||'').replace(/\s+/g,' ').trim(),g=String(a.gabarito||'').trim().toUpperCase()[0];
      if(st.length<40||(g!=='C'&&g!=='E'))continue;
      await put('questions','qg'+uid(),{alts:'',aula:ref.aula||0,banca:'Inédita · estilo Cebraspe',comment:String(a.comentario||'').trim(),concursoId:'',covn:x.i,covt:clip(x.c.t,60),createdAt:Date.now(),date:'',err:'',gab:g,jobId:jid,lote:'ia',marked:'',qn:0,sec:'Inéditas do ciclo',src:'ia',statement:st,subjectId:j.subjectId||'',topicId:j.topicId||'',why:''});added++}
  }
  if(added){V.qsnap={};toast(added+' questões inéditas criadas para fechar o ciclo')}
  return added}
async function covCycle(jid){try{const j=get('method',jid);if(!j||!j.summaryId||j.covManual)return 0;if(S.questions.some(q=>q.jobId===jid&&q.covn==null))await covAssign(jid);return await covFill(jid)}catch(e){console.error(e);return 0}}
ACT.qcov=async b=>{
  const sid=b.dataset.s,jids=[...new Set(S.questions.filter(q=>q.subjectId===sid&&q.jobId).map(q=>q.jobId))];
  if(!jids.length){toast('Estas questões não vieram de um PDF do Método');return}
  let n=0;for(const j of jids)n+=await covAssign(j);
  V.qi[sid]=0;V.qsnap[sid]=null;render();
  toast(n?n+' questões ligadas aos conceitos. As primeiras cobrem um conceito de cada.':'Não consegui ligar as questões aos conceitos. Gere os tópicos de conceitos na etapa 4 do Método e tente de novo.');
};

/* seções de questões (comentadas, listas, gabaritos) NÃO entram no resumo: só o conteúdo teórico */
const QSEC=/^(quest(oes|ao)\b|lista de quest|gabarito|exercicios?\b|simulado|bateria|caderno de quest|resolucao de quest|comentarios? (as|das|de) quest|quest(oes|ao) comentadas?)/;
const QLINE=/^\s*(\(?\d{1,3}\)?[.)\-–]\s*)?\(?(cespe|cebraspe|fcc|fgv|vunesp|esaf|cesgranrio|idecan|ibfc|quadrix|consulplan|ibade|cs-ufg|aocp|instituto aocp)\b/i;
const QNUM=/^\s*quest(ã|a)o\s*\d+\b/i;
function sumTxts(jid,upto){
  const j=get('method',jid);if(!j)return [];
  const out=[];let qmode=null; // {lvl} ou {lvl:0} (por padrão de linha)
  for(let i=0;i<=upto;i++){
    const lines=jTxt(jid,i).split('\n'),keep=[];let drop=0;
    for(const l of lines){
      const hm=l.match(/^(#{1,6})\s+(.*)$/);
      if(hm){
        const lv=hm[1].length,isQ=QSEC.test(nrm(hm[2]));
        if(isQ){qmode={lvl:lv};drop++;continue}
        if(qmode&&(qmode.lvl===0||lv<=qmode.lvl))qmode=null;
        if(qmode){drop++;continue}
        keep.push(l);continue;
      }
      if(!qmode&&(QNUM.test(l)||QLINE.test(l))){qmode={lvl:0};}
      if(qmode){drop++;continue}
      keep.push(l);
    }
    out.push({text:keep.join('\n').replace(/\n{3,}/g,'\n\n'),drop});
  }
  return out;
}
const LAY=`- LINGUAGEM DE LEIGO (prioridade): escreva como se explicasse a alguém que nunca viu a matéria. Frases curtas, palavras do dia a dia, sem "juridiquês" desnecessário. Todo termo técnico ou sigla aparece junto de uma explicação simples em poucas palavras (ex.: "**fato gerador** = o acontecimento que faz nascer o imposto"). Mantenha o termo técnico original, mas SEMPRE explique com palavras fáceis logo ao lado.
- EXEMPLOS: para cada conceito importante, dê um exemplo concreto do cotidiano (com pessoas, valores ou situações simples, como "João compra um carro…") em um quadro > [!example] Exemplo. Os exemplos são só para ilustrar e podem ser inventados por você; não os atribua ao material.
- Ordem didática: primeiro a ideia geral em 1–2 frases simples, depois os detalhes, depois exceções.
- TABELAS (use MUITAS): sempre que houver 2 ou mais itens comparáveis, classificações, requisitos, prazos, espécies, diferenças ou regra × exceção, monte uma TABELA em vez de texto corrido. Pelo menos uma tabela por título principal (##) quando o conteúdo permitir. Evite parágrafos longos: prefira tabelas, listas curtas e quadros coloridos.
- JURISPRUDÊNCIA: TODA decisão, súmula, tese ou julgado (STF, STJ, TST, tribunais) vai numa TABELA própria, nunca em lista ou texto. Cabeçalho obrigatório: | ⚖️ Jurisprudência | O que decidiu (em palavras simples) | Em prática |. Uma linha por julgado: coluna 1 = tribunal + número (ex.: STF · ADI 3046), coluna 2 = a tese em linguagem fácil, coluna 3 = um mini-exemplo ou o que isso muda. (O app pinta essas tabelas de vermelho.)
- Variedade visual: alterne tabelas, quadros coloridos (> [!success]/[!danger]/[!warning]/[!info]/[!example]/[!tip]), listas curtas e, quando ajudar, um esquema em passos (1 → 2 → 3). Destaque o termo-chave em **negrito**.
- ORDEM LÓGICA: reorganize títulos e parágrafos numa sequência de estudo que faça sentido (do básico ao complexo: conceito → características → classificação → regras → exceções), mesmo que o material original esteja fora de ordem. Agrupe o que é do mesmo assunto, sem perder nenhum conteúdo. Use títulos claros e numerados (## 1. …, ### 1.1 …).
- MINI-INTRODUÇÃO: ao começar CADA título principal (##), escreva logo abaixo, em 1–2 frases simples, um quadro > [!tip] 🧭 A seguir: o que vamos estudar nesta parte e por que importa. Quando mudar de um assunto para outro, o quadro também diz como ele se liga ao anterior.
`;
const RULES_FULL=`REGRAS:
${LAY}- Cubra TODO o trecho: não deixe de fora nenhum conceito, definição, requisito, exceção, prazo, valor, súmula, julgado, nem doutrinador citado (nome do autor + a posição dele). Não invente nada que não esteja no trecho.
- Preserve os termos técnicos originais.
- Escreva em português, em Markdown, com títulos (##/###), listas hierárquicas e TABELAS para comparações, diferenças e regras × exceções.
- Use quadros: > [!success] Título (conceito essencial) · > [!danger] Título (pegadinha/erro comum) · > [!warning] Título (exceção/atenção) · > [!info] Título (súmula, jurisprudência, base) · > [!example] Título (macete, mnemônico e exemplo prático). Cada quadro: primeira linha "> [!tipo] Título" e as demais linhas também começando com ">".
- Quando couber, termine o tópico com um "Exemplo prático" curto.
- Não cite dicas de "palavra-gatilho" de banca.
- Se o trecho começar ou terminar no meio de um tópico, trate normalmente e indique "(continua)" no fim.
- IGNORE questões de prova, listas de questões, gabaritos e comentários de questões: NÃO resuma nem copie enunciados; resuma apenas o conteúdo teórico/material.
- Não repita o que já foi coberto antes.`;
const RULES_DIRETO=(j,i)=>{const n=Math.max(600,Math.round((j.parts[i].chars||8000)*0.17/100)*100);return `REGRAS (resumo para "bater o olho" e relembrar; o aluno estuda o PDF completo fora do app):

      for(let a=0;a<2&&!t;a++){t=await mai(partPrompt(j,i,prevTopics,tail,st.drop?clean:null),false);if(!t&&a===0){await new Promise(r=>setTimeout(r,6000))}}
      if(!t||t.trim().length<80){_run.parts[i].status='erro';await patch('method',jid,{parts:_run.parts,status:'pausado'});fail=true;break}
      const m=t.match(/T[ÓO]PICOS:\s*([\s\S]*)$/i);const md=(m?t.slice(0,m.index):t).trim();const topics=m?m[1].split(/;|\n/).map(x=>x.replace(/^[-*\s]+/,'').trim()).filter(Boolean).slice(0,40):[];
      await put('method','jo_'+jid+'_'+i,{md,topics,at:Date.now()});
      _run.parts[i]={...j.parts[i],status:'ok',topics:topics.length,outChars:md.length};
      await patch('method',jid,{parts:_run.parts.map(p=>Object.assign({},p)),status:'processando',updatedAt:Date.now()});
    }
  }finally{
    const done=_run&&_run.parts.every(p=>p.status==='ok');_run=null;render();ok=!!done;
    if(done)toast('Todas as partes foram resumidas. Toque em “Salvar resumo no app”.');else if(fail)toast('Parei numa parte com erro. Toque em Continuar para tentar de novo.');
  }
  return ok;
}

}

let _lastMd='';
async function saveSummary(jid,quiet){
  const j=get('method',jid);if(!j)return '';
  const done=j.parts.map((p,i)=>({p,i,o:jOut(j.id,i)})).filter(x=>x.p.status==='ok'&&x.o.md);
  if(!done.length){if(!quiet)toast('Nenhuma parte pronta ainda');return ''}
  const missing=j.parts.filter(p=>p.status!=='ok').length;
  const head=`# ${j.title}\n\n> [!abstract] Resumo gerado por partes\n> Fonte: ${j.fileName} · ${j.pages} páginas · ${done.length} de ${j.parts.length} partes${missing?' (⚠ faltam '+missing+' partes)':''}.\n\n### 🎨 Legenda\n> [!success] 🟢 Conceito essencial\n> [!danger] 🔴 Pegadinha / erro comum\n> [!warning] 🟠 Exceção ou atenção\n> [!info] 🔵 Súmula, jurisprudência e base\n> [!example] 🟣 Macete, mnemônico e exemplo\n\n`;
  const segs=done.map(x=>({x,t:`${x.o.md}\n\n*(págs. ${x.p.from}–${x.p.to})*\n\n---\n\n`}));
  const total=segs.reduce((a,s)=>a+s.t.length,0),N=Math.max(1,Math.ceil(total/110000)),target=total/N;
  const groups=[[]];let acc=0;segs.forEach(s=>{if(acc>=target*groups.length&&groups.length<N)groups.push([]);groups[groups.length-1].push(s);acc+=s.t.length});
  const first=j.summaryId||('r'+uid());let okAll=true;_lastMd='';
  for(let v=0;v<groups.length;v++){
    const g=groups[v],id=v===0?first:first+'_v'+(v+1),a=g[0].x.p.from,b=g[g.length-1].x.p.to;
    const ttl=j.title+(groups.length>1?` (volume ${v+1} de ${groups.length} · págs. ${a}–${b})`:'');
    const tops='\n## ✅ Tópicos cobertos'+(groups.length>1?' neste volume':'')+'\n'+g.map(s=>`- **Págs. ${s.x.p.from}–${s.x.p.to}:** ${(s.x.o.topics||[]).join('; ')}`).join('\n');
    const md=(v===0?head:`# ${ttl}\n\n`)+g.map(s=>s.t).join('')+tops;
    const ok=await putOk('summaries',id,{title:ttl,subjectId:j.subjectId||'',topicId:j.topicId||'',md,tags:['pdf','resumo-por-partes'],folder:'Resumos de PDF',createdAt:Date.now()+v,updatedAt:Date.now()+v,jobId:j.id});
    if(!ok){okAll=false;break}
    _lastMd+=md+'\n\n';
  }
  if(!okAll)return '';
  for(let v=groups.length+1;v<=(j.volumes||1);v++){const sid=first+'_v'+v;if(get('summaries',sid))await del('summaries',sid)}
  await patch('method',j.id,{summaryId:first,volumes:groups.length,status:missing?'processando':'concluido'});
  if(!quiet){covCycle(j.id);toast(groups.length>1?'Resumo salvo em '+groups.length+' volumes':'Resumo salvo na Base de conhecimento');
  setTimeout(()=>go('kb',{c:'summaries',id:first},true),400)}
  return first;
}

async function autoPipeline(jid){

}

function mmBaseDrag(cx,cy,key){const v=$('#mmv');if(!v||!V.mvb||!V.dt)return;const r=v.getBoundingClientRect(),vb=V.mvb,px=vb[0]+(cx-r.left)/r.width*vb[2],py=vb[1]+(cy-r.top)/r.height*vb[3];

${items.map((x,i)=>(i+1)+'. '+x.title).join('\n')}
Retorne JSON: {"g":[{"t":"grupo","m":[1,2,3]}]}.`,true).catch(()=>null);
  if(!r||!Array.isArray(r.g))return null;

async function mmAITree0(items,setTitle){

${items.map((x,i)=>(i+1)+'. '+x.title+(x.subs&&x.subs.length?' — blocos: '+x.subs.join('; '):'')).join('\n')}

Construa uma ÁRVORE HIERÁRQUICA LÓGICA, de 3 a 4 níveis, para o aluno entender o conteúdo do título central até a ponta de cada ramificação:
- raiz = o título do conjunto;
- 1º nível = grandes divisões do conteúdo; níveis seguintes = subdivisões/subtítulos que explicam a relação entre os mapas (ex.: conceito → classificação → espécies → exceções). Pode criar quantos ramos e subtítulos forem necessários;
- use PALAVRAS-CHAVE curtas (até 4 palavras) nos ramos e subtítulos, tirando os termos dos próprios títulos e blocos; NUNCA rótulos genéricos como "Parte 1", "Grupo A", "Outros", "Geral";
- siga uma SEQUÊNCIA LÓGICA de estudo (do geral ao específico; da definição às aplicações);
- as FOLHAS são os mapas, referenciados por número: {"m":3,"t":"palavra-chave do mapa"}; cada número de 1 a ${items.length} aparece EXATAMENTE uma vez, como folha.
Retorne JSON: {"t":"${setTitle.replace(/"/g,"'")}","c":[{"t":"ramo","c":[{"t":"subtítulo","c":[{"m":1,"t":"..."}]}]}]}.`,true);
  if(!r||!Array.isArray(r.c))return null;
  const seen=new Set();
  const walk=(n,d)=>{
    if(!n||typeof n!=='object')return null;
    const m=Math.round(+n.m);
    if(m>=1&&m<=items.length&&!seen.has(m)){seen.add(m);return {t:clip(String(n.t||items[m-1].title),60),c:[],lk:items[m-1].id}}
    if(d>=5)return null;
    const t=clip(String(n.t||'').trim(),50);if(!t||/^(parte|grupo|outros?|geral)\s*\d*$/i.test(t))return null;
    const c=(Array.isArray(n.c)?n.c:[]).map(k=>walk(k,d+1)).filter(Boolean);
    return c.length?{t,c}:null;
  };
  const kids=r.c.map(k=>walk(k,1)).filter(Boolean);
  if(!kids.length)return null;
  const miss=items.filter((x,i)=>!seen.has(i+1));
  if(miss.length){const last=kids[kids.length-1];(last.lk?kids:last.c).push(...miss.map(x=>({t:clip(x.title,60),c:[],lk:x.id})))}
  return {t:mmShort(setTitle),c:kids};
}

const mmHN=t=>norm(String(t||'').replace(/\*\*|==|[#*_`]/g,'')).replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const mmTk=t=>mmHN(t).split(' ').filter(w=>w&&!/^\d+$/.test(w)&&w.length>2);
function mmHeads(d){return String(d&&d.md||'').split('\n').map(l=>l.match(/^#{1,6}\s+(.+?)\s*#*\s*$/)).filter(Boolean).map(m=>m[1].replace(/\*\*|`/g,'').trim())}
function mmSecs(d){const out=[];let cur=null;String(d&&d.md||'').split('\n').forEach(l=>{const m=l.match(/^#{1,6}\s+(.+?)\s*#*\s*$/);if(m){cur={h:m[1].replace(/\*\*|`/g,'').trim(),t:''};out.push(cur)}else if(cur)cur.t+=' '+l});return out}
function mmHeadFor(m,strict){
  const [c,id]=String(m.srcId||'').split(':'),d=c&&get(c,id);if(!d)return '';
  const hs=mmHeads(d);if(!hs.length)return '';
  const a=mmHN(m.anchor||'');if(a){const h=hs.find(x=>mmHN(x)===a);if(h)return h}
  const t=mmHN(m.title),tt=mmTk(m.title);let best='',bs=0;
  hs.forEach(h=>{const hn=mmHN(h),ht=mmTk(h);if(!ht.length||!tt.length)return;
    let sc=hn===t?2:(hn.includes(t)||t.includes(hn))?1.2:0;
    const ov=ht.filter(w=>tt.includes(w)).length/Math.max(ht.length,tt.length);sc=Math.max(sc,ov);
    if(sc>bs){bs=sc;best=h}});
  if(bs>=0.6)return best;
  return strict?'':mmNear(m,d);
}
function mmNear(m,d){ // seção do resumo cujo conteúdo mais se parece com o mapa
  const mt=[...new Set(mmTk(mmPlain(m.outline)).filter(w=>w.length>3))];if(!mt.length)return '';
  let best='',bs=0;
  mmSecs(d).forEach(x=>{const st=new Set(mmTk(x.h+' '+x.h+' '+x.t));const ov=mt.filter(w=>st.has(w)).length/mt.length;if(ov>bs){bs=ov;best=x.h}});
  return bs>=0.12?best:'';
}

const mmImgSrc=g=>g.src||(g.doc?((get('mapimgs',g.doc)||{}).data||''):'')||g.url||'';
async function mmBitmap(file){
  try{if(window.createImageBitmap)return await createImageBitmap(file)}catch(e){}
  const d=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});
  return await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=d})}
const mmBlob=(cv,type,q)=>new Promise(r=>cv.toBlob(r,type,q));
async function mmAddImg(file){
  const m=mmGet();if(!m)return;let stage='ler';
  try{
    const bm=await mmBitmap(file),W=bm.width||bm.naturalWidth||0,H=bm.height||bm.naturalHeight||0;if(!W||!H)throw {code:'imagem_vazia'};
    const png=/png|gif|webp|svg/.test(file.type||'');
    const draw=max=>{const sc=Math.min(1,max/Math.max(W,H)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(W*sc));cv.height=Math.max(1,Math.round(H*sc));const x=cv.getContext('2d');if(!png){x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height)}x.drawImage(bm,0,0,cv.width,cv.height);return cv};
    let cv=draw(1400),blob=await mmBlob(cv,png?'image/png':'image/jpeg',.88);
    if(!blob||!blob.size){cv=draw(900);blob=await mmBlob(cv,'image/jpeg',.8)}
    if(!blob||!blob.size)throw {code:'sem_blob'};
    const g={id:'im_'+uid(),x:0,y:0,w:0,h:0};let how='';
    stage='enviar';toast('Enviando imagem…');
    try{if(!assets)throw {code:'assets_indisponivel'};const r=await assets.upload(blob,{type:blob.type});g.url=r.url;g.aid=r.id;how='ok'}
    catch(e){console.error('upload',e);
      // alternativa: guarda a imagem comprimida no banco de dados do app
      let c2=draw(900),b2=await mmBlob(c2,'image/jpeg',.78);if(b2.size>180000){c2=draw(600);b2=await mmBlob(c2,'image/jpeg',.7)}
      const data=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b2)});
      const did='mi_'+uid();S.mapimgs=[...(S.mapimgs||[]),{id:did,data}];await put('mapimgs',did,{data,createdAt:new Date().toISOString()});g.doc=did;cv=c2;how='db:'+((e&&(e.code||e.message))||'erro')}
    const vb=V.mvb||[0,0,600,400],w=Math.min(300,vb[2]*.35);Object.assign(g,{x:vb[0]+vb[2]/2-w/2,y:vb[1]+vb[3]/2-(w*cv.height/cv.width)/2,w,h:w*cv.height/cv.width});
    stage='mostrar';m.imgs=[...(m.imgs||[]),g];V.msel='i:'+g.id;mmSave(m);mmPaint();const tb=$('#mmtb');if(tb)tb.innerHTML=mmTbHtml();
    toast(how==='ok'?'Imagem adicionada: arraste para posicionar':'Imagem adicionada (modo alternativo). Arraste para posicionar')
  }catch(e){console.error(e);toast('Não foi possível adicionar a imagem ('+stage+': '+((e&&(e.code||e.message))||'erro')+')')}
}

/* ---- envio de mapas da Lulu (PDF ou imagens) ---- */
async function luluPage(src,w,h){const cv=document.createElement('canvas');cv.width=1521;cv.height=1075;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1521,1075);
  const sc=Math.min(1521/w,1075/h),dw=w*sc,dh=h*sc;x.drawImage(src,(1521-dw)/2,(1075-dh)/2,dw,dh);
  const blob=await mmBlob(cv,'image/jpeg',.85);if(!blob)throw {code:'sem_blob'};const r=await assets.upload(blob,{type:'image/jpeg'});return {id:r.id,blob}}
async function luluOutline(pdf){try{const ol=await pdf.getOutline();if(!ol||!ol.length)return[];const out=[];
  for(const it of ol){let d=it.dest;if(typeof d==='string')d=await pdf.getDestination(d);if(!d)continue;let i=typeof d[0]==='object'?await pdf.getPageIndex(d[0]):+d[0];if(i>=0)out.push({t:String(it.title||'').trim(),i})}
  return out.filter((x,k,a)=>x.t&&(k===0||x.i>a[k-1].i))}catch(e){return[]}}
async function luluFiles(files,prog){const res=[];
  for(const f of files){const R={name:f.name.replace(/\.[^.]+$/,''),ids:[],tx:[],ol:[],bl:[]};
    if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)){await loadLib('pdf');const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;R.ol=await luluOutline(pdf);
      for(let i=1;i<=pdf.numPages;i++){prog('Página '+i+' de '+pdf.numPages+'…');const pg=await pdf.getPage(i),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(3,Math.max(1,1521/v0.width,1075/v0.height))}),cv=document.createElement('canvas');cv.width=Math.ceil(vp.width);cv.height=Math.ceil(vp.height);
        let tx='';try{tx=((await pg.getTextContent()).items||[]).map(x=>x.str).join(' ').replace(/\s+/g,' ').trim()}catch(e){}
        await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;{const u=await luluPage(cv,cv.width,cv.height);R.ids.push(u.id);R.bl.push(u.blob)}R.tx.push(tx)}}
    else if(/^image\//.test(f.type)){prog('Imagem '+(res.length+1)+'…');const bm=await mmBitmap(f);{const u=await luluPage(bm,bm.width||bm.naturalWidth,bm.height||bm.naturalHeight);R.ids.push(u.id);R.bl.push(u.blob)}R.tx.push('')}
    if(R.ids.length)res.push(R)}
  return res}
// lê o título central de cada mapa (visão) e agrupa páginas seguidas do mesmo tema
async function luluThumb(id){const bl=await (await fetch('/_blob/'+id)).blob(),bm=await mmBitmap(bl),W=bm.width||bm.naturalWidth,H=bm.height||bm.naturalHeight,sc=Math.min(1,1000/W),cv=document.createElement('canvas');cv.width=Math.round(W*sc);cv.height=Math.round(H*sc);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);return await mmBlob(cv,'image/jpeg',.8)}
async function luluTitles(ids,prog,disc,bls){const ai=await ensureAI();if(!ai||!ai.json)return null;let lim=null;try{lim=await ai.limits()}catch(e){}
  if(!lim||!lim.images)return null;const N=Math.max(1,Math.min(6,lim.images.maxCount||6)),out=[];
  for(let i=0;i<ids.length;i+=N){prog('Lendo títulos '+Math.min(i+N,ids.length)+'/'+ids.length+'…');const part=ids.slice(i,i+N);let th;
    try{th=bls?bls.slice(i,i+N):await Promise.all(part.map(luluThumb))}catch(e){console.error(e);return null}
    let r=null;for(let k=0;k<2&&!r;k++){try{r=await ai.json(`As ${part.length} imagens a seguir são MAPAS MENTAIS de "${disc}" para concursos, na ordem enviada. Em cada mapa há um TÍTULO/TEMA no CENTRO (nó central). Leia o texto do nó central de cada imagem, exatamente como escrito (corrigindo apenas erros de leitura). Se o centro não tiver texto legível, use null.
Retorne JSON: {"titulos":["título da imagem 1", ... ${part.length} itens]}`,{images:th,cache:false,modelTier:'quick'})}catch(e){console.error(e);if(e&&e.code==='not_granted')return null}}
    const t=r&&Array.isArray(r.titulos)?r.titulos:[];part.forEach((_,j)=>out.push(t[j]?String(t[j]).trim():null))}
  return out}
const luluKey=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function luluGroup(ids,titles,fallback){const th=[];let last=null;
  ids.forEach((id,i)=>{const t=titles[i],k=luluKey(t);let cur=th[th.length-1];
    if(!t||!k){if(!cur)th.push({t:fallback,ids:[id],k:''});else cur.ids.push(id);return}
    if(cur&&(cur.k===k||(cur.k&&(cur.k.includes(k)||k.includes(cur.k))&&Math.min(cur.k.length,k.length)>=6)))cur.ids.push(id);else th.push({t:String(t).slice(0,80),ids:[id],k})});
  return th.map(x=>({id:'t_'+uid(),t:x.t,ids:x.ids}))}
// divide um arquivo em temas: marcadores do PDF -> IA lendo o texto das páginas -> nome do arquivo
async function luluSplit(R,disc,prog){const n=R.ids.length,one=[{t:R.name||'Mapas',ids:R.ids}];if(n<2)return one;
  const cut=(sp)=>sp.map((x,k)=>({t:x.t,ids:R.ids.slice(x.i,k+1<sp.length?sp[k+1].i:n)})).filter(x=>x.ids.length);
  if(R.ol.length>=2){const sp=R.ol.slice();if(sp[0].i>0)sp.unshift({t:R.name,i:0});return cut(sp)}
  {const ti=await luluTitles(R.ids,prog,disc,R.bl);if(ti&&ti.some(Boolean)){const g=luluGroup(R.ids,ti,R.name);if(g.length)return g.map(x=>({t:x.t,ids:x.ids}))}}
  if(R.tx.filter(t=>t.length>20).length<n/2)return one;
  prog('Identificando os temas…');
  const list=R.tx.map((t,i)=>'P'+(i+1)+': '+t.slice(0,170)).join('\n').slice(0,60000);
  const r=await mai(`Abaixo está o texto (início) de cada página de um caderno de MAPAS MENTAIS de "${disc}" para concursos. Agrupe as páginas CONSECUTIVAS em TEMAS, seguindo o assunto/título que aparece nas páginas. Cada tema é um assunto do edital (ex.: "Princípios da Administração", "Atos Administrativos", "Licitações"), com nome curto. Cubra TODAS as páginas de 1 a ${n}, sem lacunas nem sobreposição, em ordem.
Retorne JSON: {"temas":[{"t":"nome do tema","de":1,"ate":3}]}

${list}`,true);
  const T=r&&r.temas;if(!Array.isArray(T)||!T.length)return one;
  const sp=[];let ok=true,exp=1;T.slice().sort((a,b)=>a.de-b.de).forEach(x=>{if(+x.de!==exp)ok=false;exp=(+x.ate)+1;sp.push({t:String(x.t||'Tema').slice(0,80),i:(+x.de)-1})});
  if(!ok||exp!==n+1){// lacunas: reaproveita só os inícios
    const st=T.map(x=>({t:String(x.t||'Tema').slice(0,80),i:(+x.de)-1})).filter(x=>x.i>=0&&x.i<n).sort((a,b)=>a.i-b.i).filter((x,k,a)=>k===0||x.i>a[k-1].i);if(!st.length)return one;if(st[0].i>0)st.unshift({t:R.name,i:0});return cut(st)}
  return cut(sp)}

/* ---- IA da questão → adicionar ramificação a um mapa mental ---- */
V.qma={qid:'',mid:''};
function qmaCands(q){const sj=(get('subjects',q.subjectId)||{}).name||'';const a=S.maps.filter(m=>!/versão antiga/i.test(m.gt||'')&&m.ord!==-1).sort((x,y)=>(x.ord||0)-(y.ord||0));const b=a.filter(m=>mmDisc(m)===sj);return b.length?b:a}
function qmaNorm(txt){ // normaliza indentação para 2 espaços por nível, sem saltos
  const out=[],st=[];
  String(txt||'').replace(/\t/g,'  ').split('\n').forEach(l=>{if(!l.trim())return;const ind=l.length-l.replace(/^ +/,'').length;
    while(st.length&&st[st.length-1]>=ind)st.pop();
    const d=st.length;if(!out.length&&d>0){st.length=0}
    st.push(ind);out.push('  '.repeat(out.length?Math.min(st.length-1,99):0)+l.trim().replace(/\{>[^}]*\}/g,'').trim())});
  return out;
}
function qmaPlain(s){return String(s||'').replace(/\{[^}]*\}\s*$/,'').replace(/^(==b\|)|(==)$/g,'').replace(/^[!>]\s*/,'').replace(/==/g,'').replace(/\*\*/g,'').trim().toLowerCase()}
function qmaInsert(outline,pai,ramo){
  const lines=String(outline||'').replace(/\n+$/,'').split('\n'),br=qmaNorm(ramo);if(!br.length)return outline;
  let pi=0,pind=0;
  if(pai){const t=qmaPlain(pai);for(let i=0;i<lines.length;i++){if(qmaPlain(lines[i])===t){pi=i;break}}}
  pind=lines[pi].length-lines[pi].replace(/^ +/,'').length;
  let end=pi+1;while(end<lines.length&&(lines[end].length-lines[end].replace(/^ +/,'').length)>pind)end++;
  const add=br.map(l=>' '.repeat(pind+2)+l);
  lines.splice(end,0,...add);return lines.join('\n')+'\n';
}
function qmaLast(id){const h=V.qch[id]||[];let a=-1;for(let i=h.length-1;i>=0;i--)if(h[i].r==='a'){a=i;break}if(a<0)return null;let u=a-1;while(u>=0&&h[u].r!=='u')u--;return{q:u>=0?h[u].t:'',a:h[a].t}}

  qmaPick(q,last)};
async function qmaExists(q,last){
  try{
    const k=await mai(`Liste 4 a 7 termos curtos (1 a 3 palavras) que provavelmente aparecem em tópicos de mapa mental sobre o conceito explicado abaixo, incluindo sinônimos.\nDÚVIDA: ${last.q}\nEXPLICAÇÃO: ${clip(last.a,500)}\nJSON {"termos":["..."]}. Somente o JSON.`,true);
    const terms=k&&Array.isArray(k.termos)?k.termos.join(' '):'';

function mmTblParse(txt){
  return String(txt||'').split('\n').map(l=>l.replace(/\t/g,' | ')).filter(l=>l.trim()&&!/^[\s|:\-]+$/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim())).filter(r=>r.some(Boolean));
}
function mmTblSvg(title,rows){
  const fs=14,pad=9,lh=fs*1.35,maxC=230,minC=64,nc=Math.max(...rows.map(r=>r.length));
  rows=rows.map(r=>{r=r.slice();while(r.length<nc)r.push('');return r});
  const cw=[];for(let c=0;c<nc;c++){let w=0;rows.forEach((r,ri)=>{w=Math.max(w,mmW(mmPlain(r[c]),fs,ri===0||c===0)+pad*2)});cw.push(Math.min(maxC,Math.max(minC,w)))}
  const cells=rows.map((r,ri)=>r.map((t,c)=>mmWrap(t,cw[c]-pad*2,fs,ri===0||c===0)));
  const rh=cells.map(r=>Math.max(...r.map(l=>l.length))*lh+pad*2),tH=title?34:0,W=cw.reduce((a,b)=>a+b,0),H=tH+rh.reduce((a,b)=>a+b,0);
  let s=`<rect x="0" y="0" width="${W}" height="${H}" rx="10" fill="#fff" stroke="#c9d0e6" stroke-width="1.5"/>`;
  if(title)s+=`<text x="${pad+2}" y="${tH/2+1}" dominant-baseline="central" font-size="16" font-weight="700" fill="#26335f">${esc(mmPlain(title))}</text>`;
  let y=tH;
  rows.forEach((r,ri)=>{let x=0;const h=rh[ri];
    r.forEach((t,c)=>{const hd=ri===0,fc=c===0&&!hd;
      s+=`<rect x="${x}" y="${y}" width="${cw[c]}" height="${h}" fill="${hd?'#26335f':fc?'#e8ecfa':ri%2?'#f7f8fd':'#ffffff'}" stroke="#c9d0e6" stroke-width="1"/>`;
      const L=cells[ri][c];L.forEach((l,i)=>{const ty=y+pad+lh*i+lh/2;let lx=hd?x+(cw[c]-mmLineW(l,fs,true))/2:x+pad,run=null,mk='';
        const fl=()=>{if(run){mk+=`<rect x="${(run.x-2).toFixed(1)}" y="${(ty-fs*.6).toFixed(1)}" width="${(run.w+4).toFixed(1)}" height="${(fs*1.2).toFixed(1)}" rx="3" fill="${run.h?MM_HL[run.h]:'#ffe066'}"/>`;run=null}};
        if(!hd){l.forEach(k=>{const ww=mmW(k.w,fs,fc||k.b),w=mmW(k.w+' ',fs,fc||k.b);if(k.h!==null&&k.h!==undefined){if(run&&run.h===k.h)run.w=lx+ww-run.x;else{fl();run={x:lx,w:ww,h:k.h}}}else fl();lx+=w});fl()}
        const sx=hd?x+(cw[c]-mmLineW(l,fs,true))/2:x+pad;
        s+=mk+`<text x="${sx.toFixed(1)}" y="${ty.toFixed(1)}" dominant-baseline="central" font-size="${fs}" fill="${hd?'#fff':'#1b2236'}" style="white-space:pre">${l.map((k,j)=>`<tspan${(hd||fc||k.b)?' font-weight="700"':''}>${esc(k.w)}${j<l.length-1?' ':''}</tspan>`).join('')}</text>`});
      x+=cw[c]});
    y+=h});
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="'Segoe UI',system-ui,Roboto,Arial,sans-serif">${s}</svg>`;
  return {src:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),w:W,h:H};
}

/* menu: puxar da borda esquerda, deslizar para a direita ou tocar na alça abre o menu lateral */
(function(){
  const h=document.createElement('button');h.id='edgeh';h.type='button';h.setAttribute('aria-label','Abrir menu');h.dataset.act='menu';document.body.appendChild(h);
  const isOpen=()=>$('#side').classList.contains('open'),small=()=>window.innerWidth<960;
  const BAD='#mmbox,.scroll-x,svg,pre,table,input,textarea,select,[contenteditable],.sh-card,#qdots';
  let sx=0,sy=0,edge=false,ok=false;
  document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;edge=sx<=40;ok=small()&&!isOpen()&&!(e.target.closest&&e.target.closest(BAD))},{passive:true});
  document.addEventListener('touchmove',e=>{if(!ok&&!edge)return;if(!small()||isOpen())return;const t=e.touches[0],dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);
    if((edge&&dx>30&&dy<60)||(ok&&dx>90&&dy<40)){edge=false;ok=false;ACT.menu()}},{passive:true});
  document.addEventListener('mousemove',e=>{
    if(small()){if(e.clientX<=24&&!isOpen())ACT.menu();return}

/* ---- marca-texto e parágrafos de destaque no resumo ---- */
const HLC={1:'🟡',2:'🟢',3:'🩷'};
const hlRoot=()=>document.querySelector('#main article.md[data-c][data-id]');
const hlOk=r=>r&&(r.dataset.c==='summaries'||r.dataset.c==='notes');
const hlDoc=(c,id)=>get('hls',rdId(c,id));
function hlNodes(root){const out=[];const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest('button,.sec-tools,.hlbar')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});let n,acc=0;while(n=w.nextNode()){out.push({n,s:acc,e:acc+n.nodeValue.length});acc+=n.nodeValue.length}return {list:out,text:out.map(x=>x.n.nodeValue).join('')}}
function hlOff(list,cont,off){if(cont.nodeType===3){const x=list.find(y=>y.n===cont);return x?x.s+off:null}
  const r=document.createRange();r.setStart(cont,off);r.collapse(true);for(const x of list){if(r.comparePoint(x.n,0)>=0)return x.s}return list.length?list[list.length-1].e:0}
function hlFind(text,it){let s=it.o;if(text.substr(s,it.q.length)!==it.q){s=text.indexOf(it.q);if(s<0)return -1}return s}
function hlWrap(root,s,e,id,col){const {list}=hlNodes(root);list.forEach(x=>{const a=Math.max(s,x.s),b=Math.min(e,x.e);if(b<=a)return;const r=document.createRange();r.setStart(x.n,a-x.s);r.setEnd(x.n,b-x.s);const m=document.createElement('mark');m.className='hl c'+(col||1);m.dataset.hid=id;try{r.surroundContents(m)}catch(er){}})}
function hlBlockAt(root,off){const {list}=hlNodes(root);const x=list.find(y=>off>=y.s&&off<y.e);return x&&x.n.parentElement?x.n.parentElement.closest('p,li,td,blockquote,h1,h2,h3,h4,h5,h6'):null}
function hlApply(){const root=hlRoot();if(!hlOk(root))return;const d=hlDoc(root.dataset.c,root.dataset.id);if(!d||!(d.items||[]).length)return;
  const {text}=hlNodes(root);
  d.items.forEach(it=>{const s=hlFind(text,it);if(s<0)return;if(it.t==='p'){const el=hlBlockAt(root,s);if(el){el.classList.add('hlp');el.dataset.hid=it.id}}else hlWrap(root,s,s+it.q.length,it.id,it.col)})}
async function hlSave(c,did,items){const id=rdId(c,did),d=get(c,did);const doc={c,did,title:d?titleOf(c,d):'',items,at:Date.now()};
  const cur=get('hls',id);if(cur)Object.assign(cur,doc);else S.hls=[...S.hls,Object.assign({id},doc)];
  V.keepScroll=true;try{scheduleRender()}catch(e){};await put('hls',id,doc)}
/* seleção */
let HSEL=null;
function hlHeadOf(root,node){let h='';root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(x=>{if(x.compareDocumentPosition(node)&Node.DOCUMENT_POSITION_FOLLOWING)h=x.firstChild?x.firstChild.textContent:x.textContent});return clip((h||'').trim(),60)}
function hlCapture(){const sel=window.getSelection(),root=hlRoot();if(!hlOk(root)||V.view!=='kb'||!sel||!sel.rangeCount||sel.isCollapsed){return null}
  const r=sel.getRangeAt(0);if(!root.contains(r.commonAncestorContainer))return null;const {list,text}=hlNodes(root);
  let s=hlOff(list,r.startContainer,r.startOffset),e=hlOff(list,r.endContainer,r.endOffset);if(s==null||e==null||e<=s)return null;
  while(s<e&&/\s/.test(text[s]))s++;while(e>s&&/\s/.test(text[e-1]))e--;if(e-s<2)return null;
  return {root,c:root.dataset.c,did:root.dataset.id,s,e,text,list,node:r.startContainer}}
function hlBar(){let b=document.getElementById('hlbar');if(!b){b=document.createElement('div');b.id='hlbar';b.className='hlbar';b.hidden=true;document.body.appendChild(b);
  b.addEventListener('pointerdown',ev=>{const t=ev.target.closest('button');if(!t)return;ev.preventDefault();hlDo(t.dataset.k)});}
  return b}
function hlShow(sel,rm){const b=hlBar();if(!sel&&!rm){b.hidden=true;return}HSEL=sel||HSEL;b.innerHTML=rm?`<button data-k="rm" aria-label="Remover destaque">Remover</button>`:`<button data-k="1" aria-label="Marca-texto amarelo"><i class="hld" style="background:#facc15"></i></button><button data-k="2" aria-label="Marca-texto verde"><i class="hld" style="background:#4ade80"></i></button><button data-k="3" aria-label="Marca-texto rosa"><i class="hld" style="background:#f472b6"></i></button><button data-k="p" aria-label="Guardar parágrafo como destaque">Parágrafo</button><button data-k="rm" aria-label="Remover destaque">Remover</button>`;b.hidden=false}
document.addEventListener('selectionchange',()=>{if(V.view!=='kb'){const b=document.getElementById('hlbar');if(b)b.hidden=true;return}const s=hlCapture();if(s)hlShow(s);else if(!(HSEL&&HSEL.rmOnly)){const b=document.getElementById('hlbar');if(b)b.hidden=true}});
document.addEventListener('click',e=>{const m=e.target.closest&&e.target.closest('#main mark.hl');if(!m||V.view!=='kb')return;const sel=window.getSelection();if(sel&&!sel.isCollapsed)return;HSEL={rmOnly:true,hid:m.dataset.hid,c:hlRoot().dataset.c,did:hlRoot().dataset.id};hlShow(null,true);setTimeout(()=>{if(HSEL&&HSEL.rmOnly){const b=document.getElementById('hlbar');if(b)b.hidden=true;HSEL=null}},4000)},true);
async function hlDo(k){const s=HSEL;if(!s)return;const root=s.rmOnly?hlRoot():s.root;if(!root)return;const c=s.c,did=s.did,cur=(hlDoc(c,did)||{}).items||[];
  if(s.rmOnly){await hlSave(c,did,cur.filter(x=>x.id!==s.hid));toast('Destaque removido');HSEL=null;hlShow(null);return}
  const {text}=hlNodes(root);
  if(k==='rm'){const keep=cur.filter(it=>{const o=hlFind(text,it);if(o<0)return true;const a=o,b=o+it.q.length;return !(a<s.e&&b>s.s)});if(keep.length===cur.length){toast('Nada marcado aqui');return}await hlSave(c,did,keep);toast('Destaque removido');window.getSelection().removeAllRanges();hlShow(null);return}
  let add=[];const now=Date.now();
  if(k==='p'){const els=[...root.querySelectorAll('p,li,td,blockquote')].filter(x=>!x.querySelector('p,li,td,blockquote')&&!x.closest('.sec-tools'));
    const {list}=hlNodes(root);
    els.forEach(el=>{const ns=list.filter(y=>el.contains(y.n));if(!ns.length)return;const a=ns[0].s,b=ns[ns.length-1].e;if(a<s.e&&b>s.s){const q=text.slice(a,b).trim();if(q.length>=3&&!cur.some(it=>it.t==='p'&&it.o===a))add.push({id:'p'+now+'_'+a,t:'p',o:a,q:q.slice(0,600),h:hlHeadOf(root,el),at:now})}});
    if(!add.length){toast('Selecione um trecho dentro de um parágrafo');return}}
  else{const q=text.slice(s.s,s.e).slice(0,2000);add=[{id:'m'+now,t:'m',col:+k||1,o:s.s,q,h:hlHeadOf(root,s.node),at:now}]}
  await hlSave(c,did,cur.concat(add));toast(k==='p'?'⭐ Parágrafo guardado':'Marcado');window.getSelection().removeAllRanges();hlShow(null)}
/* lista de destaques */
function hlBtn(c,d){if(c!=='summaries'&&c!=='notes')return '';const n=((hlDoc(c,d.id)||{}).items||[]).length;return `<button class="btn sm" data-act="hllist" data-c="${c}" data-id="${d.id}">Destaques (${n})</button>`}
ACT.hllist=b=>{const c=b.dataset.c,id=b.dataset.id,it=((hlDoc(c,id)||{}).items||[]).slice().sort((x,y)=>x.o-y.o);
  const body=it.length?`<div class="tiny muted" style="margin-bottom:8px">Selecione um trecho no resumo para marcar com marca-texto (🟡🟢🩷) ou guarde o parágrafo com ⭐. Toque em um item para ir até ele.</div><div class="list">${it.map(x=>`<div class="item" style="display:block"><div class="row" style="align-items:flex-start;gap:8px"><button class="grow" data-act="hlgo" data-hid="${x.id}" style="text-align:left;background:none;border:0;color:inherit;padding:0"><span class="tiny muted">${x.t==='p'?'⭐ Parágrafo':(HLC[x.col]||'🟡')+' Marcado'}${x.h?' · '+esc(x.h):''}</span><div style="margin-top:3px">${esc(clip(x.q,x.t==='p'?240:160))}</div></button><button class="btn sm ghost" data-act="hldel" data-c="${c}" data-id="${id}" data-hid="${x.id}" aria-label="Remover">🗑</button></div></div>`).join('')}</div>`:'<div class="muted">Nenhum destaque ainda. Selecione um trecho do resumo e use 🟡🟢🩷 para marca-texto ou ⭐ Parágrafo para guardá-lo aqui.</div>';
  sheet('Meus destaques',body,()=>{},{noSave:true,save:'Fechar',wide:true})};
ACT.hlgo=b=>{closeSheet();setTimeout(()=>{const el=document.querySelector(`#main [data-hid="${b.dataset.hid}"]`);if(!el){toast('Texto não encontrado (o resumo mudou?)');return}el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('hlflash');setTimeout(()=>el.classList.remove('hlflash'),1800)},80)};

/* ---- ditado por voz (🎤) em campos data-mic ---- */
(function(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let cur=null;
  function stop(){if(cur){try{cur.rec.stop()}catch(e){}}}
  function toggle(ta,btn){
    if(cur&&cur.ta===ta){stop();return}
    stop();
    if(!SR){toast('Seu navegador não tem ditado aqui. Use o 🎤 do teclado do celular.');return}
    const rec=new SR();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=true;
    const base=ta.value,pre=base&&!/\s$/.test(base)?base+' ':base;let fin='';
    cur={ta,btn,rec};btn.classList.add('on');btn.textContent='⏹';
    rec.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t+' ';else it+=t}
      ta.value=pre+fin+it;ta.dispatchEvent(new Event('input',{bubbles:true}))};
    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){toast('Este app não pode usar o microfone aqui. Use o 🎤 do teclado do celular.');ta.focus()}else if(e.error!=='no-speech'&&e.error!=='aborted')toast('Erro no ditado: '+e.error)};
    rec.onend=()=>{if(cur&&cur.rec===rec){cur=null}btn.classList.remove('on');btn.textContent='🎤';if(ta.value.trim())ta.focus()};
    try{rec.start()}catch(e){toast('Não consegui iniciar o microfone.')}
  }
  function attach(ta){if(ta.dataset.micOk)return;ta.dataset.micOk='1';
    const b=document.createElement('button');b.type='button';b.className='micbtn';b.textContent='🎤';b.title='Ditar por voz';
    b.addEventListener('pointerdown',e=>e.preventDefault());
    b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggle(ta,b)});
    ta.insertAdjacentElement('afterend',b)}
  function scan(){document.querySelectorAll('textarea[data-mic]').forEach(attach)}
  new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});scan();
})();

  const SKIP='.md,textarea,input,select,option,script,style,svg,canvas,[contenteditable="true"],.emo,.keepemo,.sdhit';
  function wrap(root){
    try{
      if(!root)return;
      if(root.nodeType===3){if(root.parentNode)one(root);return}
      if(root.nodeType!==1)return;
      if(root.closest&&root.closest(SKIP))return;
      if(V&&V.view==='maps'&&(V.p.id||V.p.lulu)&&root.closest&&root.closest('#main'))return;
      const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest(SKIP))return NodeFilter.FILTER_REJECT;RX.lastIndex=0;return RX.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
      const ns=[];let n;while(n=w.nextNode())ns.push(n);ns.forEach(one);
    }catch(e){}
  }
  function one(t){
    const p=t.parentElement;if(!p||p.closest(SKIP))return;
    const s=t.nodeValue;RX.lastIndex=0;if(!RX.test(s))return;RX.lastIndex=0;
    if(V&&(V.view==='dash'||V.view==='questions'||V.view==='profile'||(V.view==='maps'&&!V.p.id&&!V.p.lulu))&&p.closest('#main')){let r=s.replace(RX,'').replace(/^\s+/,'');if(!r.trim()){const bt=p.closest('button');if(bt&&!bt.textContent.replace(RX,'').trim())r=bt.getAttribute('aria-label')||bt.title||'×'}t.nodeValue=r;return}
    const f=document.createDocumentFragment();let last=0,m;
    while((m=RX.exec(s))){if(m.index>last)f.append(s.slice(last,m.index));const e=document.createElement('span');e.className='emo';e.textContent=m[0];f.append(e);last=m.index+m[0].length}
    if(last<s.length)f.append(s.slice(last));
    t.replaceWith(f);
  }
  const st=document.createElement('style');st.textContent='.emo{display:inline-block;filter:brightness(0) invert(1);opacity:.92}:root[data-theme="light"] .emo{filter:brightness(0)}.ql{display:inline!important}.qfr .ql,.qtools .ql{display:inline!important}';document.head.appendChild(st);
  let q=[],raf=0;
  const flush=()=>{raf=0;const a=q;q=[];a.forEach(wrap)};
  new MutationObserver(ms=>{for(const m of ms){m.addedNodes.forEach(n=>{if(n.nodeType===1||n.nodeType===3)q.push(n)});if(m.type==='characterData')q.push(m.target)}if(!raf)raf=requestAnimationFrame(flush)}).observe(document.body,{childList:true,subtree:true,characterData:true});
  wrap(document.body);
})();
})();
